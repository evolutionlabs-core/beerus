openapi: 3.1.0
info:
  title: Beerus Participant Control API
  version: 0.1.0
  summary: The control API every Beerus participant serves to the control plane.
  description: |
    Every Beerus participant (a bank, NIBSS, the CBN or Connect) runs as its own process, started with `beerus run --participant <id>`. Each one serves this API to the control plane. `beerus up`, the CLI and the control room use it to start, watch and stop participants. The control plane never touches money. Beerus is a copy of Nigeria's banking infrastructure for building and learning: no real money moves through it.

    ## Authentication

    The control plane sends the control token as `Authorization: Bearer <token>`. The token is the one in the `control-token` file of the Beerus directory. This is how the current control API works, and it stays. The API only accepts loopback connections and a matching `Host` header, and it refuses any request that has an `Origin` header. A missing or wrong token returns `401 unauthenticated`.

    ## Phases

    A participant is in one phase: `provisioning`, `active`, `suspended`, `repairing`, `closing`, `closed` or `terminating`. `reason` says why in a short sentence, for example when a step failed. `generation` is the version of the participant's spec that the control plane wants. `observed_generation` is the version the participant has acted on. They match when the participant has caught up. These two fields come from the control plane's setup resource today and are not on the bank status the CLI reads now, so they are Beerus placeholders for the participant itself.

    ## Idempotency

    Provisioning is a list of steps. Each step is an idempotent ensure: running it twice gives the same result. The key of a step is the participant ID, the step ID and the generation. Faults take an `Idempotency-Key` header, because a repeat would add a second fault. So does every write of a bank: creating a customer, opening an account, a deposit, a withdrawal, an insured payout, a freeze and a close. A repeat with the same key and body returns the first answer with an `Idempotent-Replayed: true` header, and the same key with a different body returns `422 idempotency_key_reused`. Stop is safe to repeat. Close is safe to repeat with the same body and returns the current status. A close with a different body while a close is running returns `409 close_in_progress`.

    ## Time

    Times are RFC 3339 strings and end in `_at`.

    ## Errors

    Every error is `{"error":{"code","message","request_id"}}` with a snake_case `code`. Branch on `code`, never on `message`.
  contact:
    name: Evolution Labs
    url: https://github.com/evolutionlabs-core/beerus
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
servers:
  - url: http://127.0.0.1:7447
    description: A participant's control port on the local machine
tags:
  - name: lifecycle
    description: Watch a participant and move it through its phases.
  - name: faults
    description: Make a participant fail on purpose, for testing.
  - name: bank
    description: The customers, accounts and cash of a bank. Only a bank serves these.
  - name: closure
    description: What the liquidator of a failed bank does on the bank's own books while it is closing. Only a bank serves these.
  - name: books
    description: Read-only views of a bank's own ledger, for the control room and for checks. Only a bank serves these.
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: participantHealth
      tags: [lifecycle]
      summary: Check that the participant is running
      description: Answers `ok` when the process is up and can serve requests. It says nothing about the phase. Read the status for that.
      responses:
        '200':
          description: The participant is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                participant_id: bank-a
                world_id: wld_01JBC8A5T3ZK
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/status:
    get:
      operationId: participantStatus
      tags: [lifecycle]
      summary: Get the phase of the participant
      description: Returns the phase, the generation, the reason and the provisioning steps. The control plane polls it to watch a participant. A bank provisions its own database. When it starts, it makes the steps `database`, `ledger_schema` and `openbanking_schema` true by itself. It creates the database if it is missing and migrates the ledger and the open banking tables. Each step is an idempotent ensure, so a second start does nothing new and the step names say `no new migrations`. If a step fails, the bank keeps running, stays in the `provisioning` phase, shows the `error` on the step, and tries again with backoff of 1 second doubling up to 5 minutes. Until the database is ready, every call that needs the books returns `503 unavailable`. The other steps are done by the control plane and show as done.
      responses:
        '200':
          description: The participant's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                participant_id: bank-a
                kind: bank
                phase: provisioning
                reason: 'Step ledger_schema failed. Trying again.'
                generation: 3
                observed_generation: 2
                steps:
                  - id: database
                    name: Creating the bank database
                    done: true
                    started_at: '2026-11-14T10:00:00+01:00'
                    completed_at: '2026-11-14T10:00:01+01:00'
                  - id: ledger_schema
                    name: Migrating bank ledger
                    done: false
                    error: 'connection refused'
                    started_at: '2026-11-14T10:00:01+01:00'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/steps/{step_id}/ensure:
    post:
      operationId: ensureParticipantStep
      tags: [lifecycle]
      summary: Run one provisioning step
      description: Makes one provisioning step true, for example creating the database or migrating the ledger. It is idempotent. Running it twice gives the same result, and a step that is already done returns `done` at once. The key is the participant ID, the step ID and the generation. A step that fails returns 200 with `done` false and an `error`, and the control plane retries with backoff. A step ID the participant does not have returns `404 not_found`.
      parameters:
        - $ref: '#/components/parameters/StepIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureRequest'
            example:
              generation: 3
      responses:
        '200':
          description: The state of the step after the attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Step'
              example:
                id: ledger_schema
                name: Migrating bank ledger
                done: true
                started_at: '2026-11-14T10:00:01+01:00'
                completed_at: '2026-11-14T10:00:02+01:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/close:
    post:
      operationId: closeParticipant
      tags: [lifecycle]
      summary: Close a bank
      description: Starts closing a bank, and says what happens to its customers' money. It is safe to repeat. A repeat returns the current status. Only banks close. The other participants answer `409 not_closable`. A repeat with a different body while the close is running returns `409 close_in_progress`, and the message says which fields differ. The money choice is `transfer` to another bank, `payout` to the customers or `leave`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseRequest'
            example:
              money: transfer
              to: bank-b
      responses:
        '202':
          description: The bank is closing. Watch the status for the `closed` phase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                participant_id: bank-a
                kind: bank
                phase: closing
                reason: Moving customer money to bank-b.
                generation: 4
                observed_generation: 3
                steps: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The money choice does not fit. The code is `invalid_request`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_request
                  message: 'Money transfer needs a bank to receive it. Send {"money":"transfer","to":"bank-b"}.'
                  request_id: req_01JBC8A5T3ZK
  /v1/stop:
    post:
      operationId: stopParticipant
      tags: [lifecycle]
      summary: Stop the participant process
      description: Asks the process to finish its requests and exit. The data stays, and `beerus up` starts it again. It is safe to repeat. The answer comes before the process exits.
      responses:
        '202':
          description: The participant is stopping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stopping'
              example:
                participant_id: bank-a
                status: stopping
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/phase:
    put:
      operationId: setParticipantPhase
      tags: [lifecycle]
      summary: Tell the participant its phase
      description: The control plane sends the phase it wants the participant to be in, for example `suspended` or `active`, with the `generation` of the spec the phase comes from. A bank starts in the state its own config file gives and serves at once, so it does not wait for a phase. A `suspended` bank refuses the same calls with `503 unavailable` until the control plane sends `active`. The participant reloads its own config file each time, so a rename or a change of state reaches it with the phase. If the file cannot be read, the answer is `500 config_unreadable` and the old config stays. The control plane sends the phase again after a participant restarts. It is safe to repeat. The same body gives the same status. `world_id` is the ID of the Beerus world, which the health check shows. Beerus has no real-world source for this call, so the whole operation is a Beerus placeholder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhaseRequest'
            example:
              phase: suspended
              reason: Suspended by the operator.
              generation: 4
              world_id: wld_01JBC8A5T3ZK
      responses:
        '200':
          description: The participant has taken the phase. The status shows it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              example:
                participant_id: bank-a
                kind: bank
                phase: suspended
                reason: Suspended by the operator.
                generation: 4
                observed_generation: 4
                steps: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/ConfigUnreadable'
  /v1/faults:
    get:
      operationId: listParticipantFaults
      tags: [faults]
      summary: List the faults that are live
      description: Lists the faults that still apply, oldest first. A fault that has ended is not listed. Use `next_cursor` as `cursor` to read the next page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of faults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultPage'
              example:
                data:
                  - id: flt_01JBC8A5T3ZK
                    kind: down
                    until_at: '2026-11-14T11:00:00+01:00'
                    created_at: '2026-11-14T10:00:00+01:00'
                next_cursor: flt_01JBC8A5T3ZK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      operationId: setParticipantFault
      tags: [faults]
      summary: Make the participant fail
      description: Adds a fault. A `down` fault makes the participant answer NIP calls with `91`, for the time in `for` or until it is cleared. A `timeout` fault makes the participant hold its answer until the caller gives up, for the next `count` credit or credit status calls from NIBSS, and `outcome` says what it did before it went silent. `credited` posts the credit and then says nothing. `failed` and `unknown` credit nothing. Every held call uses up one of the `count`. Timeout faults live in bank memory and are lost when the bank restarts. This is what `beerus fault` does today. The idempotency key is the `Idempotency-Key` header, and a repeat returns the first fault. Beerus has `down` and `timeout`. It has no `slow` fault.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultRequest'
            example:
              kind: timeout
              outcome: credited
              count: 2
      responses:
        '201':
          description: The fault was added, or this is a replay of the first one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fault'
              example:
                id: flt_01JBC8A5T3ZK
                kind: timeout
                outcome: credited
                left: 2
                created_at: '2026-11-14T10:00:00+01:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: clearParticipantFaults
      tags: [faults]
      summary: Clear every fault
      description: Removes every live fault and says how many it removed. It is safe to repeat. A repeat clears none.
      responses:
        '200':
          description: The faults were cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cleared'
              example:
                cleared: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/customers:
    get:
      operationId: listCustomers
      tags: [bank]
      summary: List the bank's customers
      description: Lists the customers of this bank, oldest first. `bvn` limits the list to the customers with that BVN, which is how a bank finds a customer it already has when another bank moves that customer's money to it. A list is never null. Use `next_cursor` as `cursor` to read the next page. A page is never cut short without a `next_cursor`.
      parameters:
        - $ref: '#/components/parameters/BVNFilter'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
              example:
                data:
                  - id: cus_01JBC8A5T3ZK
                    name: Ada Obi
                    phone: '2348031234567'
                    bvn: '22212345678'
                    status: active
                    username: ada
                    dob: '1990-04-21'
                    created_at: '2026-11-14T10:00:00+01:00'
                next_cursor: cus_01JBC8A5T3ZK
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
    post:
      operationId: createCustomer
      tags: [bank]
      summary: Create a customer
      description: Creates a customer at this bank. The bank asks NIBSS to enrol a BVN for the name, phone and date of birth, and the same details always get the same BVN. A `username` and `password` give the customer online banking. The password is hashed and never returned. The `Idempotency-Key` is the idempotency key. A repeat with the same key and body returns the first answer with an `Idempotent-Replayed` header, and the same key with a different body returns `422 idempotency_key_reused`. A bank that is not `active` answers `409 bank_not_active`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
            example:
              name: Ada Obi
              phone: '08031234567'
              dob: '1990-04-21'
              username: ada
              password: a-long-passphrase
      responses:
        '201':
          description: The customer was created, or this is a replay of the first answer.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                id: cus_01JBC8A5T3ZK
                name: Ada Obi
                phone: '2348031234567'
                bvn: '22212345678'
                status: active
                username: ada
                dob: '1990-04-21'
                created_at: '2026-11-14T10:00:00+01:00'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
  /v1/customers/{customer_id}/close:
    post:
      operationId: closeCustomer
      tags: [bank]
      summary: Close a customer
      description: Closes a customer who has no open accounts. A customer with an open account returns `422 open_accounts`. It takes the `Idempotency-Key`, and a repeat returns the first answer.
      parameters:
        - $ref: '#/components/parameters/CustomerIDPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The customer is closed.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerClosed'
              example:
                customer: cus_01JBC8A5T3ZK
                status: closed
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
  /v1/accounts:
    get:
      operationId: listAccounts
      tags: [bank]
      summary: List the bank's accounts
      description: Lists the customer accounts of this bank with their balances, oldest first. `customer` limits the list to one customer. A list is never null. Use `next_cursor` as `cursor` to read the next page.
      parameters:
        - $ref: '#/components/parameters/CustomerFilter'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPage'
              example:
                data:
                  - nuban: '0123456789'
                    name: Ada Obi
                    customer: cus_01JBC8A5T3ZK
                    type: savings
                    status: active
                    currency: NGN
                    balance_minor: 500000
                next_cursor: '0123456789'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
    post:
      operationId: openAccount
      tags: [bank]
      summary: Open an account
      description: Opens a `current` or `savings` account for a customer and gives it a NUBAN. It takes the `Idempotency-Key`. A repeat with the same key and body returns the first account, and the same key for a different customer or type returns `422 idempotency_key_reused`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
            example:
              customer: cus_01JBC8A5T3ZK
              type: savings
      responses:
        '201':
          description: The account was opened, or this is a replay of the first answer.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                nuban: '0123456789'
                name: Ada Obi
                customer: cus_01JBC8A5T3ZK
                type: savings
                status: active
                currency: NGN
                balance_minor: 0
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
  /v1/accounts/{nuban}/close:
    post:
      operationId: closeAccount
      tags: [bank]
      summary: Close an account
      description: Closes an account whose balance is zero. An account with money in it returns `422 balance_not_zero`. It takes the `Idempotency-Key`, and a repeat returns the first answer.
      parameters:
        - $ref: '#/components/parameters/NUBANPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The account is closed.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountClosed'
              example:
                nuban: '0123456789'
                status: closed
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
  /v1/accounts/{nuban}/statement:
    get:
      operationId: accountStatement
      tags: [bank]
      summary: Read an account's statement
      description: Lists the postings on an account in the order they were made. `from` and `to` are Lagos dates and both ends are included. Use `next_cursor` as `cursor` to read the next page. A list is never null.
      parameters:
        - $ref: '#/components/parameters/NUBANPath'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of statement lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementPage'
              example:
                data:
                  - seq: 1
                    amount_minor: 500000
                    balance_after_minor: 500000
                    posted_at: '2026-11-14T10:00:00+01:00'
                    value_date: '2026-11-14'
                    narration: CASH DEPOSIT
                next_cursor: '1'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
  /v1/deposits:
    post:
      operationId: depositCash
      tags: [bank]
      summary: Deposit cash into an account
      description: Puts cash into an account at this bank's counter. `amount` is naira, such as `5000` or `5,000.50`, with at most two decimals. The answer has the amount and the new balance in kobo. It takes the `Idempotency-Key`. A repeat with the same key and body returns the first answer with an `Idempotent-Replayed` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashRequest'
            example:
              account: '0123456789'
              amount: '5000.00'
      responses:
        '201':
          description: The cash was deposited, or this is a replay of the first answer.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashResult'
              example:
                kind: deposit
                account: '0123456789'
                amount_minor: 500000
                balance_minor: 500000
                replayed: false
                posted_at: '2026-11-14T10:00:00+01:00'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
  /v1/withdrawals:
    post:
      operationId: withdrawCash
      tags: [bank]
      summary: Withdraw cash from an account
      description: Takes cash out of an account at this bank's counter. `amount` is naira, with at most two decimals. A withdrawal above the balance returns `422 insufficient_funds`, and one above the daily limit returns `422 daily_limit`. Both messages give the figures. It takes the `Idempotency-Key`. A repeat with the same key and body returns the first answer with an `Idempotent-Replayed` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashRequest'
            example:
              account: '0123456789'
              amount: '1200.00'
      responses:
        '201':
          description: The cash was withdrawn, or this is a replay of the first answer.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashResult'
              example:
                kind: withdrawal
                account: '0123456789'
                amount_minor: 120000
                balance_minor: 380000
                replayed: false
                posted_at: '2026-11-14T10:00:00+01:00'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
  /v1/transfers:
    post:
      operationId: sendTransfer
      tags: [bank]
      summary: Send a transfer from an account of this bank
      description: The bank checks the request, asks NIBSS for the name at the destination bank, debits the account with its charges, and sends the funds transfer to NIBSS over mTLS as itself. A transfer between two accounts of this bank is posted at once and never leaves the bank. The answer has the session and the charges. `status` is `success` when the destination bank credited, `reversed` when NIBSS refused or the destination bank did not credit, and the bank has put the money back, or `pending` when nobody has answered yet. A pending transfer is checked again by the bank at `next_check_at`, and `POST /v1/nip/sends/{session_id}/status-query` checks it at once. `closure` is true for a transfer that moves money out of a bank that is closing. NIBSS honours it only while the bank is `terminating`, and refuses it with `closure_not_allowed` otherwise. It takes the `Idempotency-Key`. A repeat with the same key and body returns the first answer with an `Idempotent-Replayed` header.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferBody'
            example:
              from: '9010000014'
              to_bank: bank-b
              to: '9020000011'
              amount: '25000'
              narration: Rent for November
      responses:
        '200':
          description: The transfer was done, reversed or left pending, or this is a replay of the first answer.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResult'
              example:
                kind: nip
                from_bank: bank-a
                from: '9010000014'
                to_bank: bank-b
                to: '9020000011'
                to_name: ADA OBI
                session_id: '000014261114103000123456789012'
                status: success
                response_code: '00'
                amount_minor: 2500000
                fee_minor: 1000
                vat_minor: 75
                stamp_duty_minor: 5000
                total_debit_minor: 2506075
                sender_balance_after_minor: 7493925
                at: '2026-11-14T10:30:00+01:00'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/transfers/quote:
    post:
      operationId: quoteTransfer
      tags: [bank]
      summary: Price a transfer without sending it
      description: Takes the same body as a transfer and says what it would cost and leave, with the name at the destination bank. It debits nothing and starts no session. It takes no `Idempotency-Key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferBody'
            example:
              from: '9010000014'
              to_bank: bank-b
              to: '9020000011'
              amount: '25000'
      responses:
        '200':
          description: The quote. It has no `session_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResult'
              example:
                kind: nip
                from_bank: bank-a
                from: '9010000014'
                to_bank: bank-b
                to: '9020000011'
                to_name: ADA OBI
                status: ''
                response_code: ''
                amount_minor: 2500000
                fee_minor: 1000
                vat_minor: 75
                stamp_duty_minor: 5000
                total_debit_minor: 2506075
                sender_balance_after_minor: 7493925
                at: '2026-11-14T10:30:00+01:00'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/nip/sends/open:
    get:
      operationId: countOpenSends
      tags: [bank]
      summary: Count the transfers this bank is still sending
      description: Returns how many transfers the bank has debited and not yet finished with NIBSS. The control plane waits for it to reach zero before it closes or purges the bank.
      responses:
        '200':
          description: The number of open sends.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenSends'
              example:
                open_sends: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/nip/sends/{session_id}/status-query:
    post:
      operationId: queryTransferStatus
      tags: [bank]
      summary: Ask NIBSS about a transfer this bank sent
      description: The bank sends a status query to NIBSS for the session now, whatever the time of the next check. A session that is still `pending` stays so, and NIBSS counts the query. A session that NIBSS has resolved as failed is reversed at this bank before the answer. A `404` from NIBSS makes the bank send the transfer again with the same `session_id`. If NIBSS refuses that resend, the bank reverses the debit and answers `422 send_refused`. A `session_id` that is not 30 digits gets `400 invalid_request`. The answer is the session as NIBSS holds it. `404 not_found` means this bank never sent the session and holds no open send for it.
      parameters:
        - $ref: '#/components/parameters/SessionIDPath'
      responses:
        '200':
          description: The session as NIBSS holds it now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendSession'
              example:
                session_id: '000014261114103000123456789012'
                from_code: '000014'
                to_code: '090201'
                from_nuban: '9010000014'
                to_nuban: '9020000011'
                amount_minor: 2500000
                narration: Rent for November
                status: '00'
                outcome: credited
                tsq_attempts: 1
                created_at: '2026-11-14T10:30:00+01:00'
                resolved_at: '2026-11-14T10:32:00+01:00'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/accounts/{nuban}:
    get:
      operationId: getAccount
      tags: [bank]
      summary: Read one account
      description: Returns one customer account with its balance now. `customer` is the ID of the customer who owns the account, so this is how an aggregator or the control plane finds the owner of an account number. An account number that is not a customer account of this bank returns `404 not_found`.
      parameters:
        - $ref: '#/components/parameters/NUBANPath'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                nuban: '0123456789'
                name: Ada Obi
                customer: cus_01JBC8A5T3ZK
                type: savings
                status: active
                currency: NGN
                balance_minor: 500000
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/accounts/{nuban}/freeze:
    post:
      operationId: freezeAccount
      tags: [closure]
      summary: Freeze an account of a closing bank
      description: Stops debits on an account. The liquidator freezes what is left after the insured payout, so the money stays on the books of the failed bank until the claim is settled. Only a bank in the `closing` phase freezes accounts. Any other phase returns `409 bank_not_closing`. A closed account cannot be frozen and returns `422 account_restricted`. It is safe to repeat. An account that is already frozen returns the same answer. It takes the `Idempotency-Key`, and a repeat returns the first answer.
      parameters:
        - $ref: '#/components/parameters/NUBANPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The account is frozen.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                nuban: '0123456789'
                name: Ada Obi
                customer: cus_01JBC8A5T3ZK
                type: savings
                status: frozen
                currency: NGN
                balance_minor: 500000
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/closure-payouts:
    get:
      operationId: listClosurePayouts
      tags: [closure]
      summary: List what has been paid out per account
      description: Lists the accounts that have received an insured payout, with the total paid to each in kobo, ordered by account number. An account that has had no payout is not listed. The liquidator reads it to see how much of the insured limit each customer has used. It works in every phase. A list is never null. Use `next_cursor` as `cursor` to read the next page.
      parameters:
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of payout totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosurePaidPage'
              example:
                data:
                  - account_number: '0123456789'
                    paid_minor: 500000
                next_cursor: '0123456789'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createClosurePayout
      tags: [closure]
      summary: Pay out insured deposits from an account
      description: When the CBN revokes a bank's licence, the NDIC pays each depositor up to the insured limit. This call makes the failed bank pay cash out of one account on its own books. It debits the account and the bank's vault. Only a bank in the `closing` phase pays out. Any other phase returns `409 bank_not_closing`. The amount must be above zero and at most the balance of the account. An amount above the balance returns `422 insufficient_funds`, and the message gives both figures. The bank checks the balance in the same transaction as the posting, so two payouts cannot together take more than the account holds. The insured limit is not checked here, because the caller works out the amount. It takes the `Idempotency-Key`. A repeat with the same key and body returns the first answer with an `Idempotent-Replayed` header, and the same key with a different amount returns `422 idempotency_key_reused`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosurePayoutRequest'
            example:
              account_number: '0123456789'
              amount_minor: 500000
      responses:
        '201':
          description: The payout was posted, or this is a replay of the first answer.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosurePayout'
              example:
                account_number: '0123456789'
                amount_minor: 500000
                balance_minor: 0
                replayed: false
                posted_at: '2026-11-14T10:00:00+01:00'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '409':
          $ref: '#/components/responses/BankConflict'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/ledger/check:
    get:
      operationId: checkLedger
      tags: [books]
      summary: Check that the books balance
      description: The bank checks its own ledger and reports what it found. The trial balance is the sum of every posting and must be zero. A balance mismatch is a customer account whose stored balance differs from its postings. An event mismatch is a customer account whose statement lines do not add up to its balance. An unbalanced entry is a posting that does not net to zero or has fewer than two lines. `ok` is true when all of them are clean. The lists hold account codes and entry IDs, and are never null. It works in every phase. The control plane calls it to verify a bank.
      responses:
        '200':
          description: What the check found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerCheck'
              example:
                ok: true
                trial_balance_minor: 0
                balance_mismatches: []
                event_mismatches: []
                unbalanced_entries: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/books/totals:
    get:
      operationId: booksTotals
      tags: [books]
      summary: Count the customers, accounts and deposits
      description: Returns how many active customers and open customer accounts the bank has, and the sum of all customer balances in kobo. The control room shows it on its overview. It works in every phase.
      responses:
        '200':
          description: The totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookTotals'
              example:
                customers: 12
                accounts: 15
                deposits_minor: 7500000000
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/books/accounts/{nuban}/entries:
    get:
      operationId: listBookEntries
      tags: [books]
      summary: List the entries on an account, newest first
      description: Lists the lines the bank has posted on a customer account, newest first, with the counterparty and the channel. It is the view the control room shows for an account. `GET /v1/accounts/{nuban}/statement` lists the same postings oldest first for a customer. Use `next_cursor` as `cursor` to read the next page. A list is never null. An account number that is not a customer account of this bank returns `404 not_found`.
      parameters:
        - $ref: '#/components/parameters/NUBANPath'
        - $ref: '#/components/parameters/ListLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEntryPage'
              example:
                data:
                  - id: '41'
                    account: '0123456789'
                    seq: 2
                    amount_minor: -120000
                    balance_after_minor: 380000
                    posted_at: '2026-11-14T10:30:00+01:00'
                    value_date: '2026-11-14'
                    narration: CASH WITHDRAWAL
                    channel: branch
                    reference: '0010000000041'
                next_cursor: '2'
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/books/accounts/{nuban}/entries/{entry_id}:
    get:
      operationId: getBookEntry
      tags: [books]
      summary: Read one entry of an account
      description: Returns one line the bank has posted on a customer account. An account or entry that does not exist returns `404 not_found`.
      parameters:
        - $ref: '#/components/parameters/NUBANPath'
        - $ref: '#/components/parameters/EntryIDPath'
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEntry'
              example:
                id: '41'
                account: '0123456789'
                seq: 2
                amount_minor: -120000
                balance_after_minor: 380000
                posted_at: '2026-11-14T10:30:00+01:00'
                value_date: '2026-11-14'
                narration: CASH WITHDRAWAL
                channel: branch
                reference: '0010000000041'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/BankNotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/books/sessions/{session_id}:
    get:
      operationId: listSessionEntries
      tags: [books]
      summary: List the entries this bank posted for a NIP session
      description: Lists every line on customer accounts of this bank that belongs to the NIP session, oldest first. It holds the debit, the credit and the charges of a transfer that touched this bank. The list is empty when the bank posted nothing for the session. It is never paged, because one session has a handful of lines. A session that has more than 1000 lines returns an error instead of a cut list. A `session_id` that is not 30 digits gets `400 invalid_request`.
      parameters:
        - $ref: '#/components/parameters/SessionIDPath'
      responses:
        '200':
          description: The entries of the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSessionEntries'
              example:
                data:
                  - id: '43'
                    account: '9010000014'
                    seq: 4
                    amount_minor: -2500000
                    balance_after_minor: 7500000
                    posted_at: '2026-11-14T10:30:00+01:00'
                    value_date: '2026-11-14'
                    narration: TRF TO ADA OBI/9020000011
                    channel: nip
                    session_id: '000014261114103000123456789012'
                    reference: '0140000000043'
                    counterparty:
                      name: ADA OBI
                      account_number: '9020000011'
                      bank_code: '000015'
                      bank_name: Bank B
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/logins:
    post:
      operationId: loginCustomer
      tags: [bank]
      summary: Check a customer's online banking login
      description: Checks the username and password of a customer against this bank and returns the customer ID. An aggregator uses it when a customer signs in to see their connections. A wrong username, a wrong password and a closed customer all return the same `422 invalid_login`, so the answer does not say which one it was. The bank never logs the password and never returns it. This call is not a write and takes no `Idempotency-Key`. It does not count failed tries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: ada
              password: a-long-passphrase
      responses:
        '200':
          description: The login is right.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
              example:
                customer_id: cus_01JBC8A5T3ZK
        '400':
          $ref: '#/components/responses/BankBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/BankUnprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The control token, from the `control-token` file of the Beerus directory. The API only accepts loopback connections.
  headers:
    IdempotentReplayed:
      description: Set to `true` when the answer is a replay of the first one for this `Idempotency-Key`.
      schema:
        type: string
        enum: ['true']
  parameters:
    SessionIDPath:
      name: session_id
      in: path
      required: true
      description: The 30 digit NIP session ID.
      schema:
        type: string
        pattern: '^[0-9]{30}$'
      example: '000014261114103000123456789012'
    StepIDPath:
      name: step_id
      in: path
      required: true
      description: The provisioning step ID.
      schema:
        $ref: '#/components/schemas/StepID'
      example: ledger_schema
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique key per write, chosen by the caller. A replay with the same key and body returns the first response. The same key with a different body returns `422 idempotency_key_reused`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 5c0d8a3e-7a1f-4f7e-9d0b-2a4c6e8f1b3d
    ListLimit:
      name: limit
      in: query
      required: false
      description: The page size, from 1 to 1000. The default is 100. The cap of 1000 is a Beerus placeholder. A number outside the range returns `422 invalid_request`.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      example: 100
    BVNFilter:
      name: bvn
      in: query
      required: false
      description: Only the customers with this BVN, which is exactly 11 digits. It matches the BVN exactly, whatever the status of the customer. A BVN that is not 11 digits returns `400 invalid_request`.
      schema:
        type: string
        pattern: '^[0-9]{11}$'
      example: '22212345678'
    EntryIDPath:
      name: entry_id
      in: path
      required: true
      description: The ID of the entry, as `id` in the entry list.
      schema:
        type: string
      example: '41'
    CustomerFilter:
      name: customer
      in: query
      required: false
      description: Only the accounts of this customer ID.
      schema:
        type: string
      example: cus_01JBC8A5T3ZK
    FromDate:
      name: from
      in: query
      required: false
      description: The first day to include, as a date such as `2026-03-01`.
      schema:
        type: string
        format: date
      example: '2026-11-01'
    ToDate:
      name: to
      in: query
      required: false
      description: The last day to include, as a date such as `2026-03-31`. It must not be before `from`.
      schema:
        type: string
        format: date
      example: '2026-11-30'
    CustomerIDPath:
      name: customer_id
      in: path
      required: true
      description: The customer ID.
      schema:
        type: string
      example: cus_01JBC8A5T3ZK
    NUBANPath:
      name: nuban
      in: path
      required: true
      description: The 10-digit account number.
      schema:
        type: string
      example: '0123456789'
    Limit:
      name: limit
      in: query
      required: false
      description: The page size, from 1 to 500. The default is 50. The cap of 500 is a Beerus placeholder.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      example: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the last page. A cursor that is not valid returns `400 invalid_cursor`.
      schema:
        type: string
      example: flt_01JBC8A5T3ZK
  schemas:
    StepID:
      type: string
      description: A provisioning step. A bank has `allocate`, `directory`, `database`, `ledger_schema`, `openbanking_schema`, `certs`, `cbn`, `site` and `api`. NIBSS and the CBN have `database`, `schema` and `settlement`.
      enum: [allocate, directory, database, ledger_schema, openbanking_schema, certs, cbn, site, api, schema, settlement]
    Health:
      type: object
      description: The answer of the health check.
      required: [status, participant_id, world_id]
      properties:
        status:
          type: string
          description: Always `ok` when the process answers.
          enum: [ok]
        participant_id:
          type: string
          description: The ID the participant was started with.
        world_id:
          type: string
          description: The ID of the Beerus world the participant belongs to.
    Step:
      type: object
      description: One provisioning step.
      required: [id, name, done]
      properties:
        id:
          $ref: '#/components/schemas/StepID'
        name:
          type: string
          description: A short label for people.
        done:
          type: boolean
          description: True when the step is complete.
        error:
          type: string
          description: Why the last attempt failed. It is absent when the step did not fail.
        started_at:
          type: string
          format: date-time
          description: When the last attempt started.
        completed_at:
          type: string
          format: date-time
          description: When the step completed. It is absent until `done` is true. Today's name for this field is `at`.
    Status:
      type: object
      description: The phase of a participant.
      required: [participant_id, kind, phase, generation, observed_generation, steps]
      properties:
        participant_id:
          type: string
          description: The ID the participant was started with.
        kind:
          type: string
          description: What the participant is.
          enum: [bank, nibss, cbn, connect]
        phase:
          type: string
          description: Where the participant is in its life.
          enum: [provisioning, active, suspended, repairing, closing, closed, terminating]
        reason:
          type: string
          description: A short sentence about why the participant is in this phase. It is absent when there is nothing to say.
        generation:
          type: integer
          format: int64
          description: The version of the spec the control plane wants.
          minimum: 0
        observed_generation:
          type: integer
          format: int64
          description: The version of the spec the participant has acted on.
          minimum: 0
        steps:
          type: array
          description: The provisioning steps, in order.
          items:
            $ref: '#/components/schemas/Step'
        problems:
          type: array
          description: Things an operator must look at. A bank lists each consent event NIBSS refused for good, with the reason. NIBSS lists settlement sessions not posted to the CBN a minute after their cutoff, and transfers not settled a minute after their cutoff. The CBN lists where its books disagree. It is absent when there is nothing to report, except for NIBSS and the CBN, which always send it.
          items:
            type: string
        posted_sessions:
          type: integer
          format: int64
          minimum: 0
          description: How many settlement sessions NIBSS has posted to the CBN. Only NIBSS reports it. It is absent when NIBSS could not count them.
        settlement_checked_at:
          type: string
          format: date-time
          description: When a bank last compared its books with the CBN. Only a bank reports it.
        settlement_problems:
          type: array
          description: Where a bank's books disagree with the CBN's settlement balance or postings, or where its NIP payable and receivable disagree with its open position at NIBSS, one sentence for each. Only a bank reports it. It is absent when the books agree.
          items:
            type: string
    PhaseRequest:
      type: object
      description: The phase the control plane wants.
      required: [phase, generation, world_id]
      properties:
        phase:
          type: string
          description: The phase to take.
          enum: [provisioning, active, suspended, repairing, closing, closed, terminating]
        reason:
          type: string
          description: A short sentence about why. It is left out when there is nothing to say.
        generation:
          type: integer
          format: int64
          description: The version of the spec this phase comes from. The participant reports it back as `observed_generation`.
          minimum: 0
        world_id:
          type: string
          description: The ID of the Beerus world the participant belongs to.
    EnsureRequest:
      type: object
      description: Which generation of the spec the step is for.
      required: [generation]
      properties:
        generation:
          type: integer
          format: int64
          description: The generation the control plane wants. The step is keyed by it.
          minimum: 0
    CloseRequest:
      type: object
      description: What happens to the customers' money when a bank closes.
      required: [money]
      properties:
        money:
          type: string
          description: The default choice for every customer.
          enum: [transfer, payout, leave]
        to:
          type: string
          description: The bank ID that receives the money. It is required when `money` is `transfer`.
        customers:
          type: object
          description: A choice per customer ID that differs from `money`.
          additionalProperties:
            type: string
            enum: [transfer, payout, leave]
    Stopping:
      type: object
      description: The answer of a stop request.
      required: [participant_id, status]
      properties:
        participant_id:
          type: string
          description: The ID the participant was started with.
        status:
          type: string
          description: Always `stopping`.
          enum: [stopping]
    FaultRequest:
      type: object
      description: A fault to add.
      required: [kind]
      properties:
        kind:
          type: string
          description: '`down` answers NIP calls with `91`. `timeout` does the work and gives no answer.'
          enum: [down, timeout]
        outcome:
          type: string
          description: What a `timeout` fault did before it went silent. It is required for `timeout`, and not allowed for `down`.
          enum: [credited, failed, unknown]
        count:
          type: integer
          description: How many inbound calls a `timeout` fault covers. The default is 1. It is not allowed for `down`.
          minimum: 1
        for:
          type: string
          examples: ['1h30m']
          description: How long a `down` fault lasts, in Go duration format, such as `1h30m`. It must be above zero and at most `24h`, which is a Beerus placeholder. Without it the fault lasts until cleared. It is not allowed for `timeout`.
    Fault:
      type: object
      description: A fault that is live.
      required: [id, kind, created_at]
      properties:
        id:
          type: string
          description: The fault ID.
        kind:
          type: string
          description: The kind of fault.
          enum: [down, timeout]
        outcome:
          type: string
          description: What a `timeout` fault did. It is absent for `down`.
          enum: [credited, failed, unknown]
        left:
          type: integer
          description: How many inbound calls a `timeout` fault still covers. It is absent for `down`.
          minimum: 1
        until_at:
          type: string
          format: date-time
          description: When a `down` fault ends. It is absent when the fault lasts until cleared. Today's name for this field is `until`.
        created_at:
          type: string
          format: date-time
          description: When the fault was added.
    OpenSends:
      type: object
      description: How many transfers the bank is still sending.
      required: [open_sends]
      properties:
        open_sends:
          type: integer
          minimum: 0
          description: The number of transfers debited at this bank that NIBSS has not yet finished with.
    FaultPage:
      type: object
      description: One page of faults.
      required: [data]
      properties:
        data:
          type: array
          description: The faults on this page.
          items:
            $ref: '#/components/schemas/Fault'
        next_cursor:
          type: string
          description: Pass this as `cursor` to read the next page. It is absent on the last page.
    Cleared:
      type: object
      description: How many faults were cleared.
      required: [cleared]
      properties:
        cleared:
          type: integer
          description: The number of faults removed.
          minimum: 0
    Customer:
      type: object
      description: A customer of the bank.
      required: [id, name, phone, bvn, status, dob, created_at]
      properties:
        id:
          type: string
          description: The customer ID.
        name:
          type: string
          description: The customer's name.
        phone:
          type: string
          description: The phone number in international form without a plus, such as `2348031234567`.
        bvn:
          type: string
          description: The BVN NIBSS enrolled for the name, phone and date of birth.
        status:
          type: string
          description: Whether the customer can bank.
          enum: [active, closed]
        username:
          type: string
          description: The online banking username. It is absent when the customer has none.
        dob:
          type: string
          format: date
          description: The date of birth.
        created_at:
          type: string
          format: date-time
          description: When the customer was created.
        closed_at:
          type: string
          format: date-time
          description: When the customer was closed. It is absent while the customer is active.
    CustomerRequest:
      type: object
      description: A customer to create.
      required: [name, phone, dob]
      properties:
        name:
          type: string
          description: The customer's name.
        phone:
          type: string
          description: A Nigerian phone number, such as `08031234567` or `+2348031234567`.
        dob:
          type: string
          format: date
          description: The date of birth, such as `1990-04-21`.
        username:
          type: string
          description: An online banking username. It must be unique at the bank. Without one the customer has no online banking.
        password:
          type: string
          description: The online banking password. The bank stores a hash and never returns it.
    CustomerPage:
      type: object
      description: One page of customers.
      required: [data]
      properties:
        data:
          type: array
          description: The customers on this page.
          items:
            $ref: '#/components/schemas/Customer'
        next_cursor:
          type: string
          description: Pass this as `cursor` to read the next page. It is absent on the last page.
    CustomerClosed:
      type: object
      description: The answer of a customer close.
      required: [customer, status]
      properties:
        customer:
          type: string
          description: The customer ID.
        status:
          type: string
          description: Always `closed`.
          enum: [closed]
    Account:
      type: object
      description: A customer account with its balance.
      required: [nuban, name, customer, type, status, currency, balance_minor]
      properties:
        nuban:
          type: string
          description: The 10-digit account number.
        name:
          type: string
          description: The account name.
        customer:
          type: string
          description: The ID of the customer who owns the account.
        type:
          type: string
          description: The account product.
          enum: [current, savings]
        status:
          type: string
          description: Whether the account can post. `frozen` and `closed` accounts refuse debits, and `closed` ones refuse credits too.
          enum: [active, frozen, pnd, closed]
        currency:
          type: string
          description: The currency code. It is `NGN`.
        balance_minor:
          type: integer
          format: int64
          description: The balance in kobo.
    AccountRequest:
      type: object
      description: An account to open.
      required: [customer, type]
      properties:
        customer:
          type: string
          description: The ID of the customer who will own the account.
        type:
          type: string
          description: The account product.
          enum: [current, savings]
    AccountPage:
      type: object
      description: One page of accounts.
      required: [data]
      properties:
        data:
          type: array
          description: The accounts on this page.
          items:
            $ref: '#/components/schemas/Account'
        next_cursor:
          type: string
          description: Pass this as `cursor` to read the next page. It is absent on the last page.
    AccountClosed:
      type: object
      description: The answer of an account close.
      required: [nuban, status]
      properties:
        nuban:
          type: string
          description: The account number.
        status:
          type: string
          description: Always `closed`.
          enum: [closed]
    StatementLine:
      type: object
      description: One posting on an account.
      required: [seq, amount_minor, balance_after_minor, posted_at, value_date, narration]
      properties:
        seq:
          type: integer
          format: int64
          description: The position of the posting on the account. It only goes up.
        amount_minor:
          type: integer
          format: int64
          description: The amount in kobo. A credit is positive and a debit is negative.
        balance_after_minor:
          type: integer
          format: int64
          description: The balance in kobo after this posting.
        posted_at:
          type: string
          format: date-time
          description: When the bank posted it.
        value_date:
          type: string
          format: date
          description: The day the posting counts for.
        narration:
          type: string
          description: The text on the statement.
        session_id:
          type: string
          description: The NIP session that caused the posting. It is absent for cash and other postings.
    StatementPage:
      type: object
      description: One page of statement lines.
      required: [data]
      properties:
        data:
          type: array
          description: The lines on this page.
          items:
            $ref: '#/components/schemas/StatementLine'
        next_cursor:
          type: string
          description: Pass this as `cursor` to read the next page. It is absent on the last page.
    TransferBody:
      type: object
      description: A transfer to make or to price.
      required: [from, to, amount]
      additionalProperties: false
      properties:
        from:
          type: string
          description: The 10-digit account number to debit. It is an account of this bank.
        to_bank:
          type: string
          description: The ID of the destination bank. It defaults to this bank.
        to:
          type: string
          description: The 10-digit account number to credit.
        amount:
          type: string
          description: The amount in naira, such as `25000` or `25,000.50`, with at most two decimals. It must be above zero.
        narration:
          type: string
          description: The payer's note, with at most 100 characters.
        closure:
          type: boolean
          description: True for a transfer that moves money out of a bank that is closing. It carries no charges and skips the net debit cap.
    TransferResult:
      type: object
      description: What a transfer did, or what a quote says it would do.
      required: [kind, from_bank, from, to_bank, to, to_name, status, response_code, amount_minor, fee_minor, vat_minor, stamp_duty_minor, total_debit_minor, sender_balance_after_minor, at]
      properties:
        kind:
          type: string
          description: '`internal` between two accounts of one bank, `nip` through NIBSS.'
          enum: [internal, nip]
        from_bank:
          type: string
          description: The ID of the sending bank.
        from:
          type: string
          description: The account that was debited.
        to_bank:
          type: string
          description: The ID of the destination bank.
        to:
          type: string
          description: The account to credit.
        to_name:
          type: string
          description: The account name at the destination bank.
        session_id:
          type: string
          description: The 30 digit NIP session ID. It is absent for an internal transfer and for a quote.
        status:
          type: string
          description: '`success`, `reversed` or `pending`. It is empty on a quote.'
          enum: ['', success, reversed, pending]
        response_code:
          type: string
          description: '`00` on success, the NIP code that failed the transfer when it was reversed, and `pending` while nobody has answered. It is empty on a quote.'
        amount_minor:
          type: integer
          format: int64
          description: The amount in kobo.
        fee_minor:
          type: integer
          format: int64
          description: The NIP charge in kobo.
        vat_minor:
          type: integer
          format: int64
          description: The VAT on the charge in kobo.
        stamp_duty_minor:
          type: integer
          format: int64
          description: The stamp duty in kobo.
        total_debit_minor:
          type: integer
          format: int64
          description: The amount and the charges, in kobo.
        sender_balance_after_minor:
          type: integer
          format: int64
          description: The balance of the account after the transfer, in kobo.
        next_check_at:
          type: string
          format: date-time
          description: When the bank checks a pending transfer with NIBSS again.
        at:
          type: string
          format: date-time
          description: When the transfer started.
    SendSession:
      type: object
      description: One NIP session as NIBSS holds it. The NIP API describes it as `Session`.
      required: [session_id, from_code, to_code, from_nuban, to_nuban, amount_minor, narration, status, tsq_attempts, created_at]
      properties:
        session_id:
          type: string
          description: The 30 digit NIP session ID.
        from_code:
          type: string
          description: The NIP code of the sending bank.
        to_code:
          type: string
          description: The NIP code of the destination bank.
        from_nuban:
          type: string
          description: The account that was debited.
        to_nuban:
          type: string
          description: The account to credit.
        amount_minor:
          type: integer
          format: int64
          description: The amount in kobo.
        narration:
          type: string
          description: The payer's note.
        status:
          type: string
          description: '`pending`, or the two digit response code the session ended with.'
        outcome:
          type: string
          description: '`credited`, `failed` or `unknown`. It is absent while a pending session has no known outcome.'
        tsq_attempts:
          type: integer
          description: How many status queries NIBSS has counted.
        next_tsq_at:
          type: string
          format: date-time
          description: When NIBSS expects the next status query.
        created_at:
          type: string
          format: date-time
          description: When the session started.
        resolved_at:
          type: string
          format: date-time
          description: When the session got its final code.
        settlement_session:
          type: string
          description: The settlement session that includes this session.
        closure:
          type: boolean
          description: True for a transfer that moves money out of a closing bank.
    CashRequest:
      type: object
      description: Cash to deposit or withdraw.
      required: [account, amount]
      properties:
        account:
          type: string
          description: The 10-digit account number.
        amount:
          type: string
          description: The amount in naira, such as `5000` or `5,000.50`, with at most two decimals. It must be above zero.
    CashResult:
      type: object
      description: What a deposit or withdrawal did.
      required: [kind, account, amount_minor, balance_minor, replayed, posted_at]
      properties:
        kind:
          type: string
          description: What was done.
          enum: [deposit, withdrawal]
        account:
          type: string
          description: The account number.
        amount_minor:
          type: integer
          format: int64
          description: The amount in kobo.
        balance_minor:
          type: integer
          format: int64
          description: The balance in kobo after the posting.
        replayed:
          type: boolean
          description: True when the bank had already posted this key and returned the earlier posting.
        posted_at:
          type: string
          format: date-time
          description: When the bank posted it.
    ClosurePayoutRequest:
      type: object
      description: An insured payout to make from one account.
      required: [account_number, amount_minor]
      properties:
        account_number:
          type: string
          description: The 10-digit account number to pay out from.
        amount_minor:
          type: integer
          format: int64
          description: The amount in kobo. It must be above zero and at most the balance of the account.
          minimum: 1
    ClosurePayout:
      type: object
      description: What a payout did.
      required: [account_number, amount_minor, balance_minor, replayed, posted_at]
      properties:
        account_number:
          type: string
          description: The account that was paid out from.
        amount_minor:
          type: integer
          format: int64
          description: The amount paid in kobo.
        balance_minor:
          type: integer
          format: int64
          description: The balance of the account in kobo after the payout.
        replayed:
          type: boolean
          description: True when the bank had already posted this key and returned the earlier posting.
        posted_at:
          type: string
          format: date-time
          description: When the bank posted it.
    ClosurePaid:
      type: object
      description: The total paid out from one account.
      required: [account_number, paid_minor]
      properties:
        account_number:
          type: string
          description: The account number.
        paid_minor:
          type: integer
          format: int64
          description: The total paid out from the account in kobo.
    ClosurePaidPage:
      type: object
      description: One page of payout totals.
      required: [data]
      properties:
        data:
          type: array
          description: The accounts on this page.
          items:
            $ref: '#/components/schemas/ClosurePaid'
        next_cursor:
          type: string
          description: Pass this as `cursor` to read the next page. It is absent on the last page.
    LedgerCheck:
      type: object
      description: What the ledger check found.
      required: [ok, trial_balance_minor, balance_mismatches, event_mismatches, unbalanced_entries]
      properties:
        ok:
          type: boolean
          description: True when the trial balance is zero and every list is empty.
        trial_balance_minor:
          type: integer
          format: int64
          description: The sum of every posting in kobo. It must be zero.
        balance_mismatches:
          type: array
          description: The codes of customer accounts whose stored balance differs from their postings.
          items:
            type: string
        event_mismatches:
          type: array
          description: The codes of customer accounts whose statement lines do not add up to their balance.
          items:
            type: string
        unbalanced_entries:
          type: array
          description: The IDs of postings that do not net to zero or have fewer than two lines.
          items:
            type: integer
            format: int64
    BookTotals:
      type: object
      description: The size of a bank's books.
      required: [customers, accounts, deposits_minor]
      properties:
        customers:
          type: integer
          minimum: 0
          description: The number of active customers.
        accounts:
          type: integer
          minimum: 0
          description: The number of customer accounts that are not closed.
        deposits_minor:
          type: integer
          format: int64
          description: The sum of every customer balance in kobo.
    BookCounterparty:
      type: object
      description: The other side of a posting.
      required: [name, account_number, bank_code, bank_name]
      properties:
        name:
          type: string
          description: The name of the other party.
        account_number:
          type: string
          description: The account number of the other party.
        bank_code:
          type: string
          description: The NIP code of the other party's bank.
        bank_name:
          type: string
          description: The name of the other party's bank.
    BookEntry:
      type: object
      description: One line the bank posted on a customer account.
      required: [id, account, seq, amount_minor, balance_after_minor, posted_at, value_date, narration, reference]
      properties:
        id:
          type: string
          description: The ID of the line. Use it to read the entry again.
        account:
          type: string
          description: The 10-digit account number.
        seq:
          type: integer
          format: int64
          description: The position of the line on the account. It only goes up.
        amount_minor:
          type: integer
          format: int64
          description: The amount in kobo. A credit is positive and a debit is negative.
        balance_after_minor:
          type: integer
          format: int64
          description: The balance in kobo after this line.
        posted_at:
          type: string
          format: date-time
          description: When the bank posted it.
        value_date:
          type: string
          format: date
          description: The day the line counts for.
        narration:
          type: string
          description: The text on the statement.
        channel:
          type: string
          description: How the line came in, such as `branch`, `nip`, `internal` or `charge`. It is absent when the posting has no channel.
        session_id:
          type: string
          description: The NIP session that caused the line. It is absent for cash and other postings.
        reference:
          type: string
          description: The bank's own reference for the posting.
        counterparty:
          $ref: '#/components/schemas/BookCounterparty'
    BookEntryPage:
      type: object
      description: One page of entries.
      required: [data]
      properties:
        data:
          type: array
          description: The entries on this page, newest first.
          items:
            $ref: '#/components/schemas/BookEntry'
        next_cursor:
          type: string
          description: Pass this as `cursor` to read the next page. It is absent on the last page.
    BookSessionEntries:
      type: object
      description: The entries of one NIP session.
      required: [data]
      properties:
        data:
          type: array
          description: The entries, oldest first.
          items:
            $ref: '#/components/schemas/BookEntry'
    LoginRequest:
      type: object
      description: A customer's online banking login.
      required: [username, password]
      properties:
        username:
          type: string
          description: The online banking username.
        password:
          type: string
          description: The online banking password. The bank never logs or returns it.
    Login:
      type: object
      description: The customer who signed in.
      required: [customer_id]
      properties:
        customer_id:
          type: string
          description: The ID of the customer.
    Error:
      type: object
      description: The body of every error.
      required: [error]
      properties:
        error:
          type: object
          description: What went wrong.
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: A stable snake_case code. Branch on this.
            message:
              type: string
              description: A short sentence for a person. It says what to do.
            request_id:
              type: string
              description: The ID of the request, for support.
  responses:
    Unavailable:
      description: The participant is running but cannot serve yet. The code is `unavailable`. Try again soon.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unavailable
              message: The participant is still starting. Try again soon.
              request_id: req_01JBC8A5T3ZK
    BadRequest:
      description: The request is not valid. The code is `invalid_request`, or `invalid_cursor` for a cursor that is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_request
              message: 'Send {"kind":"down","for":"1h"} or {"kind":"timeout","outcome":"credited"}.'
              request_id: req_01JBC8A5T3ZK
    ConfigUnreadable:
      description: The participant could not read its own config file. The code is `config_unreadable`. The old config stays.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: config_unreadable
              message: The bank config could not be read. Fix banks/bank-a/bank.json and send the phase again.
              request_id: req_01JBC8A5T3ZK
    Unauthenticated:
      description: The control token is missing or wrong. The code is `unauthenticated`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: A valid control token is required.
              request_id: req_01JBC8A5T3ZK
    NotFound:
      description: The participant has no such step. The code is `not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: This participant has no step called site.
              request_id: req_01JBC8A5T3ZK
    Conflict:
      description: The participant cannot do this in its phase or kind. The code is `not_closable`, `phase_conflict`, or `close_in_progress` for a close with a different body while a close is running.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_closable:
              summary: The participant is not a bank.
              value:
                error:
                  code: not_closable
                  message: Only banks can be closed. nibss is a nibss participant.
                  request_id: req_01JBC8A5T3ZK
            close_in_progress:
              summary: A close with a different body while a close is running.
              value:
                error:
                  code: close_in_progress
                  message: 'bank-a is already closing with money transfer to bank-b, and this request has money payout. Wait for the close to finish, or repeat the first request.'
                  request_id: req_01JBC8A5T3ZK
    Unprocessable:
      description: The fault cannot be added. The code is `invalid_request` for a fault that does not fit, such as a `for` above `24h`, or `idempotency_key_reused` for a key used with a different body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: idempotency_key_reused
              message: 'Key 5c0d8a3e-7a1f-4f7e-9d0b-2a4c6e8f1b3d was first used with kind timeout, outcome credited and count 2, and this request has kind down. Use a new key, or repeat the first request.'
              request_id: req_01JBC8A5T3ZK
    BankBadRequest:
      description: The request is not valid. The code is `invalid_request` for a body or an `Idempotency-Key` that does not fit, or `invalid_cursor` for a cursor that is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              summary: The body is not what the call takes.
              value:
                error:
                  code: invalid_request
                  message: 'Send {"customer":"cus_...","type":"current"}.'
                  request_id: req_01JBC8A5T3ZK
            missing_key:
              summary: A write without an Idempotency-Key.
              value:
                error:
                  code: invalid_request
                  message: An Idempotency-Key header of 1 to 255 characters is required on writes.
                  request_id: req_01JBC8A5T3ZK
            invalid_bvn:
              summary: The BVN filter is not 11 digits.
              value:
                error:
                  code: invalid_request
                  message: bvn must be 11 digits.
                  request_id: req_01JBC8A5T3ZK
            invalid_cursor:
              summary: The cursor is not from a page this call gave.
              value:
                error:
                  code: invalid_cursor
                  message: That cursor is not valid. Use next_cursor from the last page.
                  request_id: req_01JBC8A5T3ZK
    BankNotFound:
      description: The customer or account does not exist at this bank. The code is `not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            customer:
              summary: No such customer.
              value:
                error:
                  code: not_found
                  message: No such customer.
                  request_id: req_01JBC8A5T3ZK
            account:
              summary: No such account.
              value:
                error:
                  code: not_found
                  message: No such account.
                  request_id: req_01JBC8A5T3ZK
            entry:
              summary: No such entry on the account.
              value:
                error:
                  code: not_found
                  message: No such entry.
                  request_id: req_01JBC8A5T3ZK
    BankConflict:
      description: The bank cannot do this now. The code is `bank_not_active` when the bank is not in the `active` phase, `bank_not_closing` when an insured payout or a freeze is asked of a bank that is not in the `closing` phase, or `username_taken` when another customer has the username.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            bank_not_active:
              summary: The bank is suspended.
              value:
                error:
                  code: bank_not_active
                  message: Bank A is suspended, so it cannot do this now.
                  request_id: req_01JBC8A5T3ZK
            bank_not_closing:
              summary: A payout or a freeze at a bank that is not closing.
              value:
                error:
                  code: bank_not_closing
                  message: Bank A is active, so it cannot pay out or freeze accounts; that happens only while a bank is closing.
                  request_id: req_01JBC8A5T3ZK
            username_taken:
              summary: The username belongs to another customer.
              value:
                error:
                  code: username_taken
                  message: 'Username is taken: ada.'
                  request_id: req_01JBC8A5T3ZK
    BankUnprocessable:
      description: The request is well formed but the bank refuses it, and the customer can fix it. The code says why.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalid_request:
              summary: A value does not fit, such as a limit above 1000.
              value:
                error:
                  code: invalid_request
                  message: Limit must be a number from 1 to 1000.
                  request_id: req_01JBC8A5T3ZK
            idempotency_key_reused:
              summary: The key was used with a different request.
              value:
                error:
                  code: idempotency_key_reused
                  message: This Idempotency-Key was used with a different request.
                  request_id: req_01JBC8A5T3ZK
            insufficient_funds:
              summary: A withdrawal above the balance.
              value:
                error:
                  code: insufficient_funds
                  message: 'Account 0123456789 holds ₦3,800.00 and ₦100,000.00 was asked for; withdraw ₦3,800.00 or less.'
                  request_id: req_01JBC8A5T3ZK
            payout_above_balance:
              summary: An insured payout above the balance.
              value:
                error:
                  code: insufficient_funds
                  message: 'Account 0123456789 holds ₦3,800.00 and a payout of ₦100,000.00 was asked for; pay out ₦3,800.00 or less.'
                  request_id: req_01JBC8A5T3ZK
            payout_not_positive:
              summary: An insured payout of zero.
              value:
                error:
                  code: invalid_request
                  message: The amount must be above zero, got 0.
                  request_id: req_01JBC8A5T3ZK
            invalid_login:
              summary: The username or password is wrong.
              value:
                error:
                  code: invalid_login
                  message: The username or password is wrong.
                  request_id: req_01JBC8A5T3ZK
            daily_limit:
              summary: A withdrawal above the daily limit.
              value:
                error:
                  code: daily_limit
                  message: 'Account 0123456789 has used ₦90,000.00 of its ₦100,000.00 daily limit and ₦20,000.00 was asked for; withdraw ₦10,000.00 or less today.'
                  request_id: req_01JBC8A5T3ZK
            account_restricted:
              summary: The account is closed, frozen or post-no-debit.
              value:
                error:
                  code: account_restricted
                  message: Account is closed.
                  request_id: req_01JBC8A5T3ZK
            customer_closed:
              summary: The customer is closed.
              value:
                error:
                  code: customer_closed
                  message: 'Customer is closed: cus_01JBC8A5T3ZK.'
                  request_id: req_01JBC8A5T3ZK
            open_accounts:
              summary: The customer still has open accounts.
              value:
                error:
                  code: open_accounts
                  message: 'Customer has open accounts: customer cus_01JBC8A5T3ZK still has 1 open account; close them first.'
                  request_id: req_01JBC8A5T3ZK
            balance_not_zero:
              summary: The account still holds money.
              value:
                error:
                  code: balance_not_zero
                  message: 'Account balance is not zero: account 0123456789 holds ₦3,800.00; move it out by transfer or cash first.'
                  request_id: req_01JBC8A5T3ZK
            nubans_used:
              summary: The bank has used every account number.
              value:
                error:
                  code: nubans_used
                  message: No NUBANs left.
                  request_id: req_01JBC8A5T3ZK
