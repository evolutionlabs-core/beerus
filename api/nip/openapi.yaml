openapi: 3.1.0
info:
  title: Beerus NIP API
  version: 0.1.0
  summary: The NIP calls between banks and NIBSS in Beerus.
  description: |
    NIP is the instant payment rail between banks. Beerus is a copy of Nigeria's banking infrastructure for building and learning: no real money moves through it.

    ## Who serves what

    - Tag `nibss`: served by the NIBSS participant. Banks call it to enrol a BVN, for a name enquiry, a funds transfer, a status query and the bank directory. They also read the open banking registry and record consent changes in the consent ledger.
    - Tag `bank`: served by every bank participant. NIBSS calls it to look up an account name, to credit an account and to ask whether a credit happened.
    - Tag `control`: served by the NIBSS participant to the control plane only. It registers banks and open banking clients, as NIBSS operations onboard them in the real world, and reads the consent ledger. It uses the bearer token of the participant control API and not mTLS.

    The `nibss` and `bank` directions run over mTLS. The server authorises the caller by the identity in its client certificate, not only by a valid chain. NIBSS accepts a transfer only from the bank named in `from_code`.

    ## Flow

    1. The sending bank asks NIBSS for a name enquiry on the destination account.
    2. The sending bank debits its customer, then sends the funds transfer to NIBSS. The session ID is made by the sending bank and is the idempotency key of the transfer.
    3. NIBSS records the session and calls the destination bank's credit endpoint.
    4. The destination bank credits once per session ID and answers `00`. A repeat of the same session ID returns the first result.
    5. If the sending bank gets no answer, it sends a status query. If the session failed, the sending bank reverses its own customer. NIBSS is not told about the reversal.
    6. At each settlement session, NIBSS posts the net positions to the CBN. See the settlement API.

    ## Response codes

    NIP outcomes are carried in `response_code` and `status`, in a 200 body. The error body is only for bad requests, failed authorisation, a refused request and an unavailable participant. The codes below come from `internal/nip` in Beerus. The repo holds no NIBSS source for them, so treat every code as a Beerus placeholder and not as a NIBSS fact.

    - `00`: successful.
    - `07`: invalid account.
    - `25`: no record.
    - `51`: not sufficient funds.
    - `57`: transaction not permitted, for example a restricted account.
    - `61`: transfer limit exceeded, used when a bank reaches its net debit cap.
    - `91`: institution unavailable.
    - `96`: system malfunction. It is also used for a bank code that is not in the NIBSS directory.

    A session `status` is `pending` or one of these codes. `pending` is not a response code.

    ## Session states

    A session has a `status` and an `outcome`. These are the states it can hold.

    - `pending` with no `outcome`: NIBSS has not heard from the destination bank.
    - `pending` with `outcome` `unknown`: the destination bank gave no answer. NIBSS will ask it.
    - `00` with `outcome` `credited`: final. The money moved.
    - Any other code, such as `61` or `91`, with `outcome` `failed`: final. The money did not move.

    NIBSS never records a reversal. The sending bank reverses its own customer, and the session stays `failed`.

    ## Status queries

    - While a session is `pending`, the sending bank keeps sending status queries at `next_tsq_at`. Every query counts in `tsq_attempts`.
    - NIBSS never ends a session without the destination bank's answer. While the destination bank gives no answer, the session stays `pending` with outcome `unknown`, however many queries it took. The sending bank keeps asking, with a growing wait that is capped. The wait and its cap are Beerus placeholders.
    - `00` is final. Every other code that is not `pending` is final too, `61` included. On a final failure the sending bank may reverse straight away.
    - `404` means NIBSS never received the transfer. The sending bank sends `POST /v1/transfers` again with the same `session_id`.
    - Once a destination bank answers `25` to a status query for a session, it refuses any later credit for that session with `25`, so a late retry can never pay twice.

    ## Idempotency

    A funds transfer and a credit are keyed by `session_id`. A repeat with the same details returns the first result with the header `Idempotent-Replayed: true`. The same `session_id` with different details returns `422 idempotency_key_reused`, and the message says which fields differ. A bank registration is keyed by `bank_id`, a registry client by `client_id`, and a consent event by the `source_seq` of the bank.

    ## Time and money

    Amounts are integers in minor units (kobo for NGN). Times are RFC 3339 strings and end in `_at`. Session IDs are 30 digits. Account numbers are 10 digits. The narration limit of 100 characters and the page cap of 500 are Beerus placeholders, not NIBSS facts.

    ## Errors

    Every error is `{"error":{"code","message","request_id"}}` with a snake_case `code`. Branch on `code`, never on `message`.
  contact:
    name: Evolution Labs
    url: https://github.com/evolutionlabs-core/beerus
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
servers:
  - url: https://nibss.localhost:7444
    description: The NIBSS participant on the local machine. It serves the nibss tag.
  - url: https://bank.localhost:7445
    description: A bank participant on the local machine. It serves the bank tag.
tags:
  - name: nibss
    description: Calls a bank makes to NIBSS. Served by the NIBSS participant.
  - name: bank
    description: Calls NIBSS makes to a bank. Served by each bank participant.
  - name: control
    description: Calls the control plane makes to NIBSS. It uses the control token.
security:
  - mutualTLS: []
paths:
  /v1/name-enquiries:
    get:
      operationId: nibssNameEnquiry
      tags: [nibss]
      summary: Look up an account name at any bank
      description: Asks NIBSS for the account name at a destination bank. NIBSS validates the bank code, the bank status and the account number, then asks the destination bank over mTLS. A bank that is suspended, down, refusing connections or too slow answers `91`. A bank code that is not in the directory answers `96`. The outcome is in `response_code`, in a 200 body. A registered bank may call it.
      parameters:
        - $ref: '#/components/parameters/BankCodeQuery'
        - $ref: '#/components/parameters/AccountNumberQuery'
      responses:
        '200':
          description: The enquiry was answered. Read `response_code` for the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameEnquiryResult'
              example:
                response_code: '00'
                message: Successful.
                bank_code: '000014'
                bank_name: Bank A
                account_number: '9010000014'
                account_name: ADA OBI
                bvn_status: linked
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/bvns:
    post:
      operationId: nibssEnrolBVN
      tags: [nibss]
      summary: Enrol a BVN
      description: Gives a person a BVN. It is an idempotent ensure. The same name, phone number and date of birth always return the same BVN, however many banks send them, and a new person gets the next BVN. NIBSS normalises the phone number and returns it. A registered bank may call it. A phone number or date of birth that is not valid returns `422 invalid_request` with a message that says what to send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolBVN'
            example:
              name: Ada Obi
              phone: '08031234567'
              dob: '1990-04-21'
      responses:
        '200':
          description: The BVN of this person. A repeat returns the same BVN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BVN'
              example:
                bvn: '22900000013'
                phone: '2348031234567'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The details cannot be enrolled. The code is `invalid_request`, and the message says what to send.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: invalid_request
                  message: 'Phone "12345" must start with +234 or 0.'
                  request_id: req_01JBC8A5T3ZK
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/transfers:
    post:
      operationId: nibssFundsTransfer
      tags: [nibss]
      summary: Send a funds transfer
      description: Records a NIP session and credits the destination bank. The sending bank has already debited its customer. The idempotency key is `session_id`. A repeat with the same details returns the first result, and the same `session_id` with different details returns `422 idempotency_key_reused`. NIBSS calls the destination bank next. `00` makes the session `00` and `credited`. A refusal code such as `07`, `25` or `57` makes it final with that code and `failed`. A destination bank that answers `503`, or is suspended, closed or unknown, makes it `91` or `96` and `failed`, and nothing was credited. If the destination bank gives no answer, because the call timed out or the connection failed, the session stays `pending` with outcome `unknown` and a `next_tsq_at`, and the sending bank sends a status query. NIBSS runs no background loop of its own. If the sending bank is over its net debit cap, NIBSS answers with status `61` and outcome `failed`. That is final, and the sending bank reverses its own customer at once. NIBSS reads the cap from the control plane, and answers `503` until it has one. NIBSS counts the open sessions of the sending bank, so two transfers sent at the same time cannot both pass the cap. This cap answer is a Beerus placeholder. `closure` is honoured only when the control plane has marked the sending bank `terminating`. Otherwise NIBSS answers `422 closure_not_allowed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            example:
              session_id: '000014261114103000123456789012'
              from_code: '000014'
              to_code: '090201'
              from_nuban: '9010000014'
              from_name: ADA OBI
              to_nuban: '9020000011'
              amount_minor: 2500000
              narration: Rent for November
              closure: false
      responses:
        '200':
          description: The session was recorded, or this is a replay of one already recorded. A replay carries `Idempotent-Replayed`.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                session_id: '000014261114103000123456789012'
                from_code: '000014'
                to_code: '090201'
                from_nuban: '9010000014'
                to_nuban: '9020000011'
                amount_minor: 2500000
                narration: Rent for November
                status: '00'
                outcome: credited
                tsq_attempts: 0
                created_at: '2026-11-14T10:30:00+01:00'
                resolved_at: '2026-11-14T10:30:01+01:00'
                closure: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The request is well formed but cannot be done. The code is `idempotency_key_reused` when the session ID was used with different details, or `closure_not_allowed` when `closure` is true and the sending bank is not `terminating`, or `unknown_bank` when `to_code` is not in the directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reused:
                  summary: The session ID was used with different details.
                  value:
                    error:
                      code: idempotency_key_reused
                      message: 'Session 000014261114103000123456789012 was first sent with amount_minor 2500000, and this request has 3000000. Send a new session_id, or repeat the first request.'
                      request_id: req_01JBC8A5T3ZK
                closure:
                  summary: A closure transfer from a bank that is not terminating.
                  value:
                    error:
                      code: closure_not_allowed
                      message: 'Bank 000014 is active, so it cannot send a closure transfer. Close the bank first, and send it again when the bank is terminating.'
                      request_id: req_01JBC8A5T3ZK
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/transfers/{session_id}/status-queries:
    post:
      operationId: nibssStatusQuery
      tags: [nibss]
      summary: Ask for the status of a transfer
      description: Asks NIBSS where a session stands. For a pending session it asks the destination bank, then resolves the session as credited or failed. It is safe to repeat, and each query counts in `tsq_attempts`. Only the sending bank of the session may ask. Keep asking at `next_tsq_at` while the status is `pending`. NIBSS gives a final answer only when the destination bank answers, with `00` when it credited and `25` when it holds no credit. A destination bank that stays silent leaves the session `pending`. `00` and every other code that is not `pending` are final. On a final failure the sending bank reverses its own customer and NIBSS is not told. A `404` means NIBSS never received the transfer. Send `POST /v1/transfers` again with the same `session_id`.
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: The session as it stands now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                session_id: '000014261114103000123456789012'
                from_code: '000014'
                to_code: '090201'
                from_nuban: '9010000014'
                to_nuban: '9020000011'
                amount_minor: 2500000
                narration: Rent for November
                status: '91'
                outcome: failed
                tsq_attempts: 2
                created_at: '2026-11-14T10:30:00+01:00'
                resolved_at: '2026-11-14T10:35:00+01:00'
                closure: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: NIBSS never received this transfer. Send `POST /v1/transfers` again with the same `session_id`. The code is `not_found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  message: NIBSS has no session 000014261114103000123456789012. Send the transfer again with the same session_id.
                  request_id: req_01JBC8A5T3ZK
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/banks:
    get:
      operationId: nibssBankDirectory
      tags: [nibss]
      summary: List the banks in the NIBSS directory
      description: Lists the banks NIBSS knows, ordered by NIP code. Removed banks are left out. It never shows a bank's URL or certificate identity. Use `next_cursor` as `cursor` to read the next page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of banks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankPage'
              example:
                data:
                  - id: bank-a
                    name: Bank A
                    nip_code: '000014'
                    nuban_code: '014'
                    type: commercial
                    status: active
                next_cursor: '000014'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/nip/account-names/{account_number}:
    get:
      operationId: bankAccountNameEnquiry
      tags: [bank]
      summary: Look up an account name at this bank
      description: NIBSS asks a bank for the name on one of its accounts. The outcome is in `response_code`, in a 200 body. A bank that is down answers `91`.
      parameters:
        - $ref: '#/components/parameters/AccountNumberPath'
      responses:
        '200':
          description: The enquiry was answered. Read `response_code` for the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountName'
              example:
                response_code: '00'
                account_number: '9020000011'
                account_name: CHIDI OKAFOR
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/BankClosed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/nip/credits:
    post:
      operationId: bankCredit
      tags: [bank]
      summary: Credit an account for a NIP session
      description: NIBSS asks the destination bank to credit a customer. The idempotency key is `session_id`. The bank credits once per session ID. A repeat with the same details returns the first result with `Idempotent-Replayed`. The same `session_id` with different details returns `422 idempotency_key_reused`. The bank answers `00` when it credited, and a refusal code such as `07`, `25` or `57` when it did not. Once the bank has answered `25` to a status query for a session, it refuses any later credit for that session with `25`, so a late retry can never pay twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditRequest'
            example:
              session_id: '000014261114103000123456789012'
              from_code: '000014'
              from_bank_name: Bank A
              from_nuban: '9010000014'
              from_name: ADA OBI
              to_nuban: '9020000011'
              amount_minor: 2500000
              narration: Rent for November
              created_at: '2026-11-14T10:30:00+01:00'
      responses:
        '200':
          description: The credit was applied, refused, or is a replay. A replay carries `Idempotent-Replayed`. A session the bank already answered `25` for is refused with `25`.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResult'
              examples:
                credited:
                  summary: The bank credited the account.
                  value:
                    session_id: '000014261114103000123456789012'
                    response_code: '00'
                refused_after_25:
                  summary: The bank already answered 25 for this session, so a late credit is refused.
                  value:
                    session_id: '000014261114103000123456789012'
                    response_code: '25'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          description: The request is well formed but cannot be done. The code is `idempotency_key_reused` when the session ID was used with different details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: idempotency_key_reused
                  message: 'Session 000014261114103000123456789012 was first credited with amount_minor 2500000, and this request has 3000000. Repeat the first request.'
                  request_id: req_01JBC8A5T3ZK
        '409':
          $ref: '#/components/responses/BankClosed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/nip/credits/{session_id}:
    get:
      operationId: bankCreditStatus
      tags: [bank]
      summary: Ask whether a session was credited
      description: NIBSS asks the destination bank whether it credited a session. The bank answers `00` if it did, and `25` if it holds no credit for that session ID. A `25` is final. Once the bank has answered `25` for a session, it refuses any later credit for that session with `25`, so a late retry can never pay twice.
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: The credit state of the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResult'
              example:
                session_id: '000014261114103000123456789012'
                response_code: '25'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/BankClosed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/control/name-enquiries:
    get:
      operationId: controlNameEnquiry
      tags: [control]
      summary: Look up an account name at any bank for the control plane
      description: The same enquiry as `nibssNameEnquiry`, for the control plane. It uses the bearer token of the participant control API and not mTLS, and it answers the same body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BankCodeQuery'
        - $ref: '#/components/parameters/AccountNumberQuery'
      responses:
        '200':
          description: The enquiry was answered. Read `response_code` for the outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameEnquiryResult'
              example:
                response_code: '00'
                message: Successful.
                bank_code: '000014'
                bank_name: Bank A
                account_number: '9010000014'
                account_name: ADA OBI
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/control/banks/{bank_id}:
    put:
      operationId: registerBank
      tags: [control]
      summary: Register a bank with NIBSS
      description: The control plane registers a bank in the NIBSS directory, as NIBSS operations onboard banks in the real world. It is an idempotent ensure keyed by `bank_id`. A repeat with the same details returns the same registration. The same `bank_id` with a different NIP code, NUBAN code, URL or certificate identity returns `422 registration_conflict`, and the message says which fields differ. The net debit cap and the collateral are part of the registration, so a registered bank always has a cap. A repeat with other figures updates them, and is not a conflict. NIBSS keeps `credit_url` and `certificate_identity` to call the bank, and never shows them in the directory.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BankIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBank'
            example:
              nip_code: '000014'
              nuban_code: '014'
              name: Bank A
              type: commercial
              credit_url: https://bank-a.localhost:7451
              certificate_identity: bank-a
              net_debit_cap_minor: 500000000
              collateral_minor: 0
      responses:
        '200':
          description: The bank is registered. It is the directory entry, without the URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankEntry'
              example:
                id: bank-a
                name: Bank A
                nip_code: '000014'
                nuban_code: '014'
                type: commercial
                status: active
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: The bank is already registered with other details, or another bank holds its code or name. The code is `registration_conflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: registration_conflict
                  message: 'Bank bank-a is registered with nip_code 000014 and credit_url https://bank-a.localhost:7451, and this request has credit_url https://bank-a.localhost:7499. Send the registered details.'
                  request_id: req_01JBC8A5T3ZK
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/control/banks/{bank_id}/status:
    put:
      operationId: setBankStatus
      tags: [control]
      summary: Change the status of a bank in the NIBSS directory
      description: The control plane tells NIBSS to suspend a bank, to take it back to `active`, to start its closure with `terminating`, or to remove it. NIBSS allows `active` to `suspended` and back, `active` or `suspended` to `terminating`, and `terminating` to `removed`. A repeat of the current status changes nothing. A bank that is `removed` stays in the directory under its ID, but is not listed to banks. Any other change returns `422 status_not_allowed`, and the message says what to do. An unknown bank returns `404 not_found`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BankIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBankStatus'
            example:
              status: suspended
      responses:
        '200':
          description: The bank has the status. It is the directory entry, without the URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankEntry'
              example:
                id: bank-a
                name: Bank A
                nip_code: '000014'
                nuban_code: '014'
                type: commercial
                status: suspended
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: NIBSS has no bank with this ID. The code is `not_found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  message: Bank bank-z is not in the NIBSS directory. Register it first.
                  request_id: req_01JBC8A5T3ZK
        '422':
          description: The bank cannot take this status from its current one. The code is `status_not_allowed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: status_not_allowed
                  message: 'Bank bank-a is terminating and cannot become active. It can become removed.'
                  request_id: req_01JBC8A5T3ZK
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/registry/clients:
    get:
      operationId: nibssRegistryClients
      tags: [nibss]
      summary: List the open banking clients in the registry
      description: Lists the clients, such as an aggregator, that are registered to use bank open banking APIs, ordered by `id`. A bank reads it to check a client's certificate name, key and redirect URIs. Only a bank NIBSS knows may read it. Use `next_cursor` as `cursor` to read the next page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of registry clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryClientPage'
              example:
                data:
                  - id: OBR-0001
                    name: Connect
                    legal_name: Connect Ltd
                    registry_id: OBR-0001
                    cac: RC1234567
                    role: aggregator
                    cert_cn: beerus-connect
                    jwk:
                      kty: EC
                      crv: P-256
                      x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                      y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                      kid: connect-1
                    redirect_uris:
                      - https://connect.localhost:7442/bank/callback
                    registered_at: '2026-11-14T10:30:00+01:00'
                next_cursor: OBR-0001
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/registry/clients/{client_id}:
    get:
      operationId: nibssRegistryClient
      tags: [nibss]
      summary: Read one open banking client in the registry
      description: Reads one registered client by `id`. Only a bank NIBSS knows may read it. An unknown client returns `404 not_found`.
      parameters:
        - $ref: '#/components/parameters/ClientIDPath'
      responses:
        '200':
          description: The registered client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryClient'
              example:
                id: OBR-0001
                name: Connect
                legal_name: Connect Ltd
                registry_id: OBR-0001
                cac: RC1234567
                role: aggregator
                cert_cn: beerus-connect
                jwk:
                  kty: EC
                  crv: P-256
                  x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                  y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                  kid: connect-1
                redirect_uris:
                  - https://connect.localhost:7442/bank/callback
                registered_at: '2026-11-14T10:30:00+01:00'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The registry has no client with this ID. The code is `not_found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: not_found
                  message: Client OBR-9999 is not in the registry.
                  request_id: req_01JBC8A5T3ZK
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/consents:
    post:
      operationId: nibssRecordConsent
      tags: [nibss]
      summary: Record a consent event in the NIBSS consent ledger
      description: A bank tells NIBSS that a consent changed, so the ledger holds every change. NIBSS takes the bank from the caller's certificate identity and never from the body. The idempotency key is `source_seq`, the number the bank gave the event in its own outbox, and it is kept per bank. A repeat with the same details returns the first record with the header `Idempotent-Replayed`. The same `source_seq` with different details returns `422 idempotency_key_reused`, and the message says which fields differ. The bank sends events in order and sends the next one only after NIBSS has taken the last.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentEventRequest'
            example:
              source_seq: 7
              consent_id: obc_01JBC8A5T3ZK
              client_id: OBR-0001
              partner_id: balance
              status: Revoked
              via: bank
              changed_at: '2026-11-14T10:30:00+01:00'
      responses:
        '200':
          description: The event is in the ledger, or this is a replay of one already recorded. A replay carries `Idempotent-Replayed`.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentEvent'
              example:
                seq: 12
                bank: bank-a
                consent_id: obc_01JBC8A5T3ZK
                client_id: OBR-0001
                partner_id: balance
                status: Revoked
                via: bank
                changed_at: '2026-11-14T10:30:00+01:00'
                source_seq: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          description: The `source_seq` of this bank was first recorded with other details. The code is `idempotency_key_reused`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: idempotency_key_reused
                  message: Source sequence 7 of bank bank-a was first recorded with other status and changed_at. Send a new source_seq, or repeat the first request.
                  request_id: req_01JBC8A5T3ZK
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/control/registry/clients:
    get:
      operationId: controlRegistryClients
      tags: [control]
      summary: List the open banking clients in the registry for the control plane
      description: The same list as `nibssRegistryClients`, for the control plane. It uses the bearer token of the participant control API and not mTLS.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of registry clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryClientPage'
              example:
                data:
                  - id: OBR-0001
                    name: Connect
                    legal_name: Connect Ltd
                    registry_id: OBR-0001
                    cac: RC1234567
                    role: aggregator
                    cert_cn: beerus-connect
                    jwk:
                      kty: EC
                      crv: P-256
                      x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                      y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                      kid: connect-1
                    redirect_uris:
                      - https://connect.localhost:7442/bank/callback
                    registered_at: '2026-11-14T10:30:00+01:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/control/registry/clients/{client_id}:
    put:
      operationId: registerRegistryClient
      tags: [control]
      summary: Register an open banking client
      description: The control plane registers a client in the registry, as the registry operator onboards a client in the real world. It is an idempotent ensure keyed by `client_id`. A repeat with the same details returns the same client. The `name`, `legal_name` and `redirect_uris` may change on a repeat, and the new values replace the old ones. The same `client_id` with a different `cac`, `role`, `cert_cn` or `jwk` returns `422 registration_conflict`, and the message says which fields differ. A `cert_cn` that belongs to another client also returns `422 registration_conflict`, and the message says to use another one. `registered_at` is set when NIBSS first registers the client and never changes. The role must be `aggregator`. A redirect URI must be an https URL, or an http URL on localhost.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureRegistryClient'
            example:
              name: Connect
              legal_name: Connect Ltd
              cac: RC1234567
              role: aggregator
              cert_cn: beerus-connect
              jwk:
                kty: EC
                crv: P-256
                x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                kid: connect-1
              redirect_uris:
                - https://connect.localhost:7442/bank/callback
      responses:
        '200':
          description: The client is registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryClient'
              example:
                id: OBR-0001
                name: Connect
                legal_name: Connect Ltd
                registry_id: OBR-0001
                cac: RC1234567
                role: aggregator
                cert_cn: beerus-connect
                jwk:
                  kty: EC
                  crv: P-256
                  x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                  y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                  kid: connect-1
                redirect_uris:
                  - https://connect.localhost:7442/bank/callback
                registered_at: '2026-11-14T10:30:00+01:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          description: The client is already registered with other details, or another client holds its certificate name. The code is `registration_conflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: registration_conflict
                  message: Client OBR-0001 is registered with cert_cn beerus-connect, and this request has cert_cn other. Send the registered details.
                  request_id: req_01JBC8A5T3ZK
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/control/consents:
    get:
      operationId: controlConsents
      tags: [control]
      summary: List the consent ledger for the control plane
      description: Lists the consent changes the banks recorded, newest first. Leave `bank` out to list every bank. It uses the bearer token of the participant control API and not mTLS. Use `next_cursor` as `cursor` to read the next page.
      security:
        - bearerAuth: []
      parameters:
        - name: bank
          in: query
          required: false
          description: Only the events of this bank, by its Beerus ID.
          schema:
            type: string
          example: bank-a
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of consent events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentPage'
              example:
                data:
                  - seq: 12
                    bank: bank-a
                    consent_id: obc_01JBC8A5T3ZK
                    client_id: OBR-0001
                    partner_id: balance
                    status: Revoked
                    via: bank
                    changed_at: '2026-11-14T10:30:00+01:00'
                    source_seq: 7
                next_cursor: '12'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: The caller presents a client certificate issued by the Beerus CA. The server authorises the caller by the certificate's identity, not only by a valid chain.
    bearerAuth:
      type: http
      scheme: bearer
      description: The control token, from the `control-token` file of the Beerus directory. Only the control plane has it.
  headers:
    IdempotentReplayed:
      description: Set to `true` when this response is a replay of the first result for the same idempotency key.
      schema:
        type: string
        enum: ['true']
    Allow:
      description: The one method this path accepts.
      schema:
        type: string
  parameters:
    BankIDPath:
      name: bank_id
      in: path
      required: true
      description: The Beerus ID of the bank.
      schema:
        type: string
      example: bank-a
    BankCodeQuery:
      name: bank_code
      in: query
      required: true
      description: The NIP code of the destination bank, such as `000014`.
      schema:
        type: string
        pattern: '^[0-9]{6}$'
      example: '000014'
    AccountNumberQuery:
      name: account_number
      in: query
      required: true
      description: The 10 digit NUBAN of the destination account.
      schema:
        type: string
        pattern: '^[0-9]{10}$'
      example: '9010000014'
    AccountNumberPath:
      name: account_number
      in: path
      required: true
      description: The 10 digit NUBAN of the account.
      schema:
        type: string
        pattern: '^[0-9]{10}$'
      example: '9020000011'
    SessionIdPath:
      name: session_id
      in: path
      required: true
      description: The 30 digit NIP session ID.
      schema:
        $ref: '#/components/schemas/SessionID'
      example: '000014261114103000123456789012'
    ClientIDPath:
      name: client_id
      in: path
      required: true
      description: The ID of the open banking client in the registry.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$'
      example: OBR-0001
    Limit:
      name: limit
      in: query
      required: false
      description: The page size, from 1 to 500. The default is 50. The cap of 500 is a Beerus placeholder.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      example: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the last page. A cursor that is not valid returns `400 invalid_cursor`.
      schema:
        type: string
      example: '000014'
  schemas:
    SessionID:
      type: string
      description: A 30 digit NIP session ID, made by the sending bank. It is the NIP code, a 12 digit Lagos time and 12 digits.
      pattern: '^[0-9]{30}$'
      examples: ['000014261114103000123456789012']
    ResponseCode:
      type: string
      description: A two digit NIP response code. See the list in the API description. Every code is a Beerus placeholder.
      pattern: '^[0-9]{2}$'
      examples: ['00']
    NameEnquiryResult:
      type: object
      description: The answer to a name enquiry at NIBSS.
      required: [response_code, message, bank_code, account_number]
      properties:
        response_code:
          $ref: '#/components/schemas/ResponseCode'
        message:
          type: string
          description: A short plain sentence about the outcome.
        bank_code:
          type: string
          description: The NIP code that was asked about.
        bank_name:
          type: string
          description: The bank name. It is absent when the code is not in the directory.
        account_number:
          type: string
          description: The account number that was asked about.
        account_name:
          type: string
          description: The account name. It is present only when `response_code` is `00`.
        bvn_status:
          type: string
          description: Whether the account holder has a BVN at NIBSS. It is present only when `response_code` is `00`. Beerus does not return this today, so it is a Beerus placeholder.
          enum: [linked, not_linked]
    EnrolBVN:
      type: object
      description: The details of a person to enrol.
      required: [name, phone, dob]
      properties:
        name:
          type: string
          description: The full name of the person.
        phone:
          type: string
          description: A Nigerian phone number, such as `08031234567` or `+2348031234567`.
        dob:
          type: string
          description: The date of birth, as `YYYY-MM-DD`.
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    BVN:
      type: object
      description: The BVN of a person.
      required: [bvn, phone]
      properties:
        bvn:
          type: string
          description: The 11 digit BVN.
          pattern: '^[0-9]{11}$'
        phone:
          type: string
          description: The phone number as NIBSS normalised it, with the country code and no plus.
    AccountName:
      type: object
      description: The answer to a name enquiry at one bank.
      required: [response_code, account_number]
      properties:
        response_code:
          $ref: '#/components/schemas/ResponseCode'
        account_number:
          type: string
          description: The account number that was asked about.
        account_name:
          type: string
          description: The account name. It is present only when `response_code` is `00`.
    TransferRequest:
      type: object
      description: A funds transfer from the sending bank. The session ID is the idempotency key.
      required: [session_id, from_code, to_code, from_nuban, from_name, to_nuban, amount_minor]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionID'
        from_code:
          type: string
          description: The NIP code of the sending bank. It must match the caller's certificate, and it starts the `session_id`.
          pattern: '^[0-9]{6}$'
        to_code:
          type: string
          description: The NIP code of the destination bank.
          pattern: '^[0-9]{6}$'
        from_nuban:
          type: string
          description: The 10 digit account number that was debited.
          pattern: '^[0-9]{10}$'
        from_name:
          type: string
          description: The name of the account holder that was debited. NIBSS passes it to the destination bank.
        to_nuban:
          type: string
          description: The 10 digit account number to credit.
          pattern: '^[0-9]{10}$'
        amount_minor:
          type: integer
          format: int64
          description: The amount in kobo. It must be above zero.
          minimum: 1
        narration:
          type: string
          description: The payer's note. It has at most 100 characters and no control characters. The limit is a Beerus placeholder.
          maxLength: 100
        closure:
          type: boolean
          description: True for a transfer that moves money out of a closing bank. It skips the net debit cap. NIBSS honours it only when the control plane has marked the sending bank `terminating`. It is a Beerus field, not a NIBSS one.
    Session:
      type: object
      description: One NIP session as NIBSS records it.
      required: [session_id, from_code, to_code, from_nuban, to_nuban, amount_minor, narration, status, tsq_attempts, created_at]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionID'
        from_code:
          type: string
          description: The NIP code of the sending bank.
        to_code:
          type: string
          description: The NIP code of the destination bank.
        from_nuban:
          type: string
          description: The account that was debited.
        to_nuban:
          type: string
          description: The account to credit.
        amount_minor:
          type: integer
          format: int64
          description: The amount in kobo.
        narration:
          type: string
          description: The payer's note.
        status:
          type: string
          description: '`pending` while the session is open, then a two digit response code. `00` means credited. Any other code means the session failed.'
          pattern: '^(pending|[0-9]{2})$'
        outcome:
          type: string
          description: 'What the session did. `credited` when the destination bank credited, `failed` when it did not, and `unknown` while the destination bank has not answered. It is absent while a pending session has no known outcome. NIBSS never records a reversal, because the sending bank reverses its own customer.'
          enum: [credited, failed, unknown]
        tsq_attempts:
          type: integer
          description: How many status queries NIBSS has run for this session. Every status query counts.
          minimum: 0
        next_tsq_at:
          type: string
          format: date-time
          description: When the sending bank should send the next status query for a pending session. The spacing is a Beerus placeholder.
        created_at:
          type: string
          format: date-time
          description: When the sending bank started the session.
        resolved_at:
          type: string
          format: date-time
          description: When the session got its final code. It is absent while pending.
        settlement_session:
          type: string
          description: The settlement session that includes this session. It is absent until the session is settled.
        closure:
          type: boolean
          description: True for a transfer that moves money out of a closing bank.
    Bank:
      type: object
      description: One bank in the NIBSS directory.
      required: [id, name, nip_code, nuban_code, type, status]
      properties:
        id:
          type: string
          description: The Beerus ID of the bank.
        name:
          type: string
          description: The bank name.
        nip_code:
          type: string
          description: The 6 digit NIP code.
        nuban_code:
          type: string
          description: The NUBAN code that starts the bank's account numbers.
        type:
          type: string
          description: The kind of bank.
          enum: [commercial, digital, microfinance]
        status:
          type: string
          description: '`active` takes transfers. `suspended` and `terminating` do not.'
          enum: [active, suspended, terminating]
    BankEntry:
      type: object
      description: One bank in the NIBSS directory, with any status. Banks see only the banks that are not `removed`.
      required: [id, name, nip_code, nuban_code, type, status]
      properties:
        id:
          type: string
          description: The Beerus ID of the bank.
        name:
          type: string
          description: The bank name.
        nip_code:
          type: string
          description: The 6 digit NIP code.
        nuban_code:
          type: string
          description: The NUBAN code that starts the bank's account numbers.
        type:
          type: string
          description: The kind of bank.
          enum: [commercial, digital, microfinance]
        status:
          type: string
          description: The status in the directory.
          enum: [active, suspended, terminating, removed]
    SetBankStatus:
      type: object
      description: The status the control plane wants for a bank.
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          description: The status to move the bank to.
          enum: [active, suspended, terminating, removed]
    RegisterBank:
      type: object
      description: What the control plane tells NIBSS about a bank.
      required: [nip_code, nuban_code, name, type, credit_url, certificate_identity, net_debit_cap_minor, collateral_minor]
      properties:
        nip_code:
          type: string
          description: The 6 digit NIP code the bank was given.
          pattern: '^[0-9]{6}$'
        nuban_code:
          type: string
          description: The 3, 5 or 6 digit NUBAN code the bank was given. This field is a Beerus addition, because Beerus allocates the code and NIBSS does not.
          pattern: '^([0-9]{3}|[0-9]{5}|[0-9]{6})$'
        name:
          type: string
          description: The bank name.
        type:
          type: string
          description: The category of the bank.
          enum: [commercial, digital, microfinance]
        credit_url:
          type: string
          format: uri
          description: The base URL where NIBSS calls the bank's `bank` operations.
        certificate_identity:
          type: string
          description: The identity in the bank's client certificate. NIBSS accepts calls for this NIP code only from this identity.
        net_debit_cap_minor:
          type: integer
          format: int64
          minimum: 0
          description: The net debit cap in kobo. A transfer that would take the open net debit of the bank above it is refused with `61`. The figure is a Beerus placeholder.
        collateral_minor:
          type: integer
          format: int64
          minimum: 0
          description: The collateral the bank holds against its cap, in kobo. It is a Beerus placeholder.
    BankPage:
      type: object
      description: One page of the bank directory.
      required: [data]
      properties:
        data:
          type: array
          description: The banks on this page.
          items:
            $ref: '#/components/schemas/Bank'
        next_cursor:
          type: string
          description: Pass this as `cursor` to read the next page. It is absent on the last page.
    CreditRequest:
      type: object
      description: A request from NIBSS to credit a customer. The session ID is the idempotency key. A field that is not listed is refused with `400 invalid_request`.
      additionalProperties: false
      required: [session_id, from_code, from_bank_name, from_nuban, from_name, to_nuban, amount_minor, created_at]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionID'
        from_code:
          type: string
          description: The NIP code of the sending bank.
          pattern: '^[0-9]{6}$'
        from_bank_name:
          type: string
          description: The name of the sending bank. The credit line shows it.
        from_nuban:
          type: string
          description: The sender's account number.
          pattern: '^[0-9]{10}$'
        from_name:
          type: string
          description: The sender's name. The credit line shows it.
        to_nuban:
          type: string
          description: The account to credit.
          pattern: '^[0-9]{10}$'
        amount_minor:
          type: integer
          format: int64
          description: The amount in kobo. It must be above zero.
          minimum: 1
        narration:
          type: string
          description: The payer's note. The limit of 100 characters is a Beerus placeholder.
          maxLength: 100
        created_at:
          type: string
          format: date-time
          description: When the sending bank started the session. The credit is dated with it.
    CreditResult:
      type: object
      description: The answer of a bank about one session.
      required: [session_id, response_code]
      properties:
        session_id:
          $ref: '#/components/schemas/SessionID'
        response_code:
          $ref: '#/components/schemas/ResponseCode'
    JWK:
      type: object
      description: The public key of a client, as an EC P-256 JSON Web Key.
      required: [kty, crv, x, y]
      properties:
        kty:
          type: string
          enum: [EC]
        crv:
          type: string
          enum: [P-256]
        x:
          type: string
          description: The base64url x coordinate.
        y:
          type: string
          description: The base64url y coordinate.
        kid:
          type: string
          description: The key ID.
    EnsureRegistryClient:
      type: object
      description: What the control plane tells NIBSS about an open banking client.
      required: [name, legal_name, cac, role, cert_cn, jwk, redirect_uris]
      properties:
        name:
          type: string
          description: The brand name of the client.
        legal_name:
          type: string
          description: The legal name of the client.
        cac:
          type: string
          description: The CAC registration number of the client. It may be empty.
        role:
          type: string
          description: The role of the client. Only `aggregator` exists.
          enum: [aggregator]
        cert_cn:
          type: string
          description: The common name in the client's certificate. A bank finds the client by it.
        jwk:
          $ref: '#/components/schemas/JWK'
        redirect_uris:
          type: array
          description: The URLs the client may send a customer back to.
          minItems: 1
          items:
            type: string
            format: uri
    RegistryClient:
      type: object
      description: An open banking client in the registry.
      required: [id, name, legal_name, registry_id, cac, role, cert_cn, jwk, redirect_uris, registered_at]
      properties:
        id:
          type: string
          description: The client ID.
        name:
          type: string
        legal_name:
          type: string
        registry_id:
          type: string
          description: The ID of the client at the registry. It is the same as `id`.
        cac:
          type: string
        role:
          type: string
          enum: [aggregator]
        cert_cn:
          type: string
        jwk:
          $ref: '#/components/schemas/JWK'
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        registered_at:
          type: string
          format: date-time
    RegistryClientPage:
      type: object
      description: One page of registry clients.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RegistryClient'
        next_cursor:
          type: string
          description: Pass this as `cursor` to read the next page. It is absent on the last page.
    ConsentStatus:
      type: string
      description: The status a consent changed to.
      enum: [AwaitingAuthorisation, Authorised, Rejected, Revoked, Expired, Dormant, ReconsentRequired]
    ConsentEventRequest:
      type: object
      description: A consent change a bank tells NIBSS about. The bank is the caller's certificate identity.
      required: [source_seq, consent_id, client_id, partner_id, status, via, changed_at]
      properties:
        source_seq:
          type: integer
          format: int64
          minimum: 1
          description: The number of the event in the bank's own outbox. It is the idempotency key, kept per bank.
        consent_id:
          type: string
          description: The consent that changed.
        client_id:
          type: string
          description: The registry client the consent was given to.
        partner_id:
          type: string
          description: The partner of the client the consent covers. It may be empty.
        status:
          $ref: '#/components/schemas/ConsentStatus'
        via:
          type: string
          description: Who made the change, such as `bank` or `aggregator`.
        changed_at:
          type: string
          format: date-time
          description: When the consent changed, in Lagos time.
    ConsentEvent:
      type: object
      description: A consent change in the NIBSS ledger.
      required: [seq, bank, consent_id, client_id, partner_id, status, via, changed_at, source_seq]
      properties:
        seq:
          type: integer
          format: int64
          description: The position of the event in the ledger. It grows by one for every new event.
        bank:
          type: string
          description: The Beerus ID of the bank that sent the event.
        consent_id:
          type: string
        client_id:
          type: string
        partner_id:
          type: string
        status:
          $ref: '#/components/schemas/ConsentStatus'
        via:
          type: string
        changed_at:
          type: string
          format: date-time
        source_seq:
          type: integer
          format: int64
    ConsentPage:
      type: object
      description: One page of the consent ledger, newest first.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConsentEvent'
        next_cursor:
          type: string
          description: Pass this as `cursor` to read the next page. It is absent on the last page.
    Error:
      type: object
      description: The body of every error.
      required: [error]
      properties:
        error:
          type: object
          description: What went wrong.
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: A stable snake_case code. Branch on this.
            message:
              type: string
              description: A short sentence for a person. It says what to do.
            request_id:
              type: string
              description: The ID of the request, for support.
  responses:
    BadRequest:
      description: The request is not valid. The code is `invalid_request`, or `invalid_cursor` for a cursor that is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: invalid_request
              message: account_number must have 10 digits.
              request_id: req_01JBC8A5T3ZK
    Forbidden:
      description: The caller's certificate identity may not make this call. The code is `forbidden`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: forbidden
              message: This certificate may not send transfers for bank 090201.
              request_id: req_01JBC8A5T3ZK
    NotFound:
      description: The path is not part of this API. The code is `not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: not_found
              message: This path is not part of the NIP API of a bank.
              request_id: req_01JBC8A5T3ZK
    MethodNotAllowed:
      description: The path does not accept this method. The code is `method_not_allowed`, and `Allow` names the method that works.
      headers:
        Allow:
          $ref: '#/components/headers/Allow'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: method_not_allowed
              message: Use POST for this path.
              request_id: req_01JBC8A5T3ZK
    Unauthenticated:
      description: The control token is missing or wrong. The code is `unauthenticated`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unauthenticated
              message: A valid control token is required.
              request_id: req_01JBC8A5T3ZK
    BankClosed:
      description: The bank is closed and takes no NIP calls. The code is `bank_closed`. Nothing was credited.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: bank_closed
              message: Bank A is closed.
              request_id: req_01JBC8A5T3ZK
    Unavailable:
      description: The participant cannot answer now. The code is `unavailable`. Try again soon.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: unavailable
              message: NIBSS is not available right now. Try again soon.
              request_id: req_01JBC8A5T3ZK
