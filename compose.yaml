name: beerus

x-beerus: &beerus
  image: beerus:local
  build: .
  user: "${BEERUS_UID:-10001}:${BEERUS_GID:-10001}"
  restart: on-failure
  environment: &env
    BEERUS_DIR: /state
    BEERUS_BIND: 0.0.0.0
    BEERUS_DATABASE_URL: postgres://postgres:beerus@postgres:5432/postgres?sslmode=disable
    BEERUS_CORE_URL: http://sim:7480
    BEERUS_PARTNER_PORT: "7443"
    BEERUS_WIDGET_PORT: "7444"
    BEERUS_CONTROL_PORT: "7480"
    BEERUS_HEALTH_PORT: "7490"
  volumes:
    - ${BEERUS_STATE:-state}:/state

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: beerus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  cbn:
    <<: *beerus
    command: ["run", "--participant", "cbn"]
    environment:
      <<: *env
      BEERUS_PARTNER_ID: ${BEERUS_PARTNER_ID:?set the partner app's ID}
      BEERUS_PARTNER_NAME: ${BEERUS_PARTNER_NAME:?set the partner app's name}
      BEERUS_PARTNER_LEGAL_NAME: ${BEERUS_PARTNER_LEGAL_NAME:?set the partner's legal name}
      BEERUS_PARTNER_PURPOSE: ${BEERUS_PARTNER_PURPOSE:?say what the partner uses the data for}
      BEERUS_PARTNER_REDIRECT_URI: ${BEERUS_PARTNER_REDIRECT_URI:?set the partner app's callback URL}
      BEERUS_PARTNER_WEBHOOK_URL: ${BEERUS_PARTNER_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:7490:7490"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beerus", "health", "http://127.0.0.1:7490/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  bank-a:
    <<: *beerus
    command: ["run", "--participant", "bank-a"]
    ports:
      - "127.0.0.1:7445:7445"
    networks:
      default:
        aliases:
          - bank-a.localhost
    depends_on:
      cbn:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beerus", "health", "http://bank-a.localhost:7445/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  bank-b:
    <<: *beerus
    command: ["run", "--participant", "bank-b"]
    ports:
      - "127.0.0.1:7446:7446"
    networks:
      default:
        aliases:
          - bank-b.localhost
    depends_on:
      cbn:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beerus", "health", "http://bank-b.localhost:7446/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  sim:
    <<: *beerus
    command: ["run", "--participant", "sim"]
    ports:
      - "127.0.0.1:7443:7443"
      - "127.0.0.1:7444:7444"
      - "127.0.0.1:7480:7480"
    networks:
      default:
        aliases:
          - connect.localhost
    depends_on:
      bank-a:
        condition: service_healthy
      bank-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beerus", "health", "--token-file", "/state/control-token", "http://127.0.0.1:7480/health"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  state:
  pgdata:
