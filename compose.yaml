name: beerus

x-beerus: &beerus
  image: beerus:local
  build: .
  user: "${BEERUS_UID:-10001}:${BEERUS_GID:-10001}"
  restart: on-failure
  environment: &env
    BEERUS_DIR: /state
    BEERUS_BIND: 0.0.0.0
    BEERUS_CORE_URL: http://sim:${BEERUS_CONTROL_PORT:-7480}
    BEERUS_PARTNER_PORT: ${BEERUS_PARTNER_PORT:-7443}
    BEERUS_WIDGET_PORT: ${BEERUS_WIDGET_PORT:-7444}
    BEERUS_CONTROL_PORT: ${BEERUS_CONTROL_PORT:-7480}
    BEERUS_BANK_A_PORT: ${BEERUS_BANK_A_PORT:-7445}
    BEERUS_BANK_B_PORT: ${BEERUS_BANK_B_PORT:-7446}
  volumes:
    - ${BEERUS_STATE:-state}:/state

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: beerus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  cbn:
    <<: *beerus
    command: ["run", "--participant", "cbn"]
    environment:
      <<: *env
      BEERUS_DATABASE_URL: postgres://postgres:beerus@postgres:5432/postgres?sslmode=disable
      BEERUS_PARTNER_REDIRECT_URI: https://balance.localhost/bank_connections/callback
      BEERUS_PARTNER_WEBHOOK_URL: ${BEERUS_PARTNER_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:${BEERUS_CBN_PORT:-7490}:7490"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beerus", "health", "http://127.0.0.1:7490/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  bank-a:
    <<: *beerus
    command: ["run", "--participant", "bank-a"]
    ports:
      - "127.0.0.1:${BEERUS_BANK_A_PORT:-7445}:${BEERUS_BANK_A_PORT:-7445}"
    networks:
      default:
        aliases:
          - bank-a.localhost
    depends_on:
      cbn:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beerus", "health", "http://bank-a.localhost:${BEERUS_BANK_A_PORT:-7445}/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  bank-b:
    <<: *beerus
    command: ["run", "--participant", "bank-b"]
    ports:
      - "127.0.0.1:${BEERUS_BANK_B_PORT:-7446}:${BEERUS_BANK_B_PORT:-7446}"
    networks:
      default:
        aliases:
          - bank-b.localhost
    depends_on:
      cbn:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beerus", "health", "http://bank-b.localhost:${BEERUS_BANK_B_PORT:-7446}/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  sim:
    <<: *beerus
    command: ["run", "--participant", "sim"]
    ports:
      - "127.0.0.1:${BEERUS_PARTNER_PORT:-7443}:${BEERUS_PARTNER_PORT:-7443}"
      - "127.0.0.1:${BEERUS_WIDGET_PORT:-7444}:${BEERUS_WIDGET_PORT:-7444}"
      - "127.0.0.1:${BEERUS_CONTROL_PORT:-7480}:${BEERUS_CONTROL_PORT:-7480}"
    networks:
      default:
        aliases:
          - connect.localhost
    depends_on:
      bank-a:
        condition: service_healthy
      bank-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "beerus", "health", "--token-file", "/state/control-token", "http://127.0.0.1:${BEERUS_CONTROL_PORT:-7480}/health"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  state:
  pgdata:
