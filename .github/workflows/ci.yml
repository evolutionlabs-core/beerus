name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BEERUS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve connect.localhost
        run: echo "127.0.0.1 connect.localhost bank-a.localhost bank-b.localhost" | sudo tee -a /etc/hosts
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 -timeout 25m ./...

  contract-full:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BEERUS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      BEERUS_CONTRACT_FULL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve local names
        run: echo "127.0.0.1 connect.localhost bank-a.localhost bank-b.localhost" | sudo tee -a /etc/hosts
      - name: Contract suite on the full stack
        run: go test -count=1 -timeout 25m ./contracttest

  multi-process:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BEERUS_PARTNER_ID: balance
      BEERUS_PARTNER_NAME: Balance
      BEERUS_PARTNER_LEGAL_NAME: Balance Test Limited
      BEERUS_PARTNER_PURPOSE: to keep your books in sync with this account
      BEERUS_PARTNER_REDIRECT_URI: https://balance.localhost/bank_connections/callback
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve local names
        run: echo "127.0.0.1 connect.localhost bank-a.localhost bank-b.localhost" | sudo tee -a /etc/hosts
      - name: Start the stack
        run: |
          mkdir -p "$RUNNER_TEMP/beerus-state"
          cat > "$RUNNER_TEMP/beerus-state/setup.yaml" <<EOF
          apiVersion: beerus.dev/v1
          kind: Setup
          metadata:
            name: beerus
          spec:
            nip:
              sessions: 4
              tsq_after: 2m
              tsq_attempts: 3
            banks:
              - id: bank-a
                name: Bank A
                type: commercial
              - id: bank-b
                name: Bank B
                type: digital
          EOF
          go build -o "$RUNNER_TEMP/beerus" ./cmd/beerus
          BEERUS_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable "$RUNNER_TEMP/beerus" init --dir "$RUNNER_TEMP/render" -f "$RUNNER_TEMP/beerus-state/setup.yaml"
          "$RUNNER_TEMP/beerus" compose --dir "$RUNNER_TEMP/render" > compose.ci.yaml
          {
            echo "COMPOSE_FILE=compose.ci.yaml"
            echo "BEERUS_STATE=$RUNNER_TEMP/beerus-state"
            echo "BEERUS_UID=$(id -u)"
            echo "BEERUS_GID=$(id -g)"
            echo "BEERUS_SETUP_FILE=/state/setup.yaml"
          } >> "$GITHUB_ENV"
          COMPOSE_FILE=compose.ci.yaml BEERUS_STATE="$RUNNER_TEMP/beerus-state" BEERUS_UID="$(id -u)" BEERUS_GID="$(id -g)" BEERUS_SETUP_FILE=/state/setup.yaml docker compose up -d --build --wait --wait-timeout 300
      - name: Done test against the containers
        env:
          BEERUS_CONTRACT_DIR: ${{ runner.temp }}/beerus-state
        run: go test -count=1 -timeout 15m -v -run TestDoneStory ./contracttest
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Spectral
        run: npx --yes @stoplight/spectral-cli@6 lint api/partner/openapi.yaml --fail-severity warn

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build CSS
        working-directory: web
        run: npm ci && npm run css
      - name: Compiled CSS is up to date
        run: git diff --exit-code internal/connect/assets/beerus.css
