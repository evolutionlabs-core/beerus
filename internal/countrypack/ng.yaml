country: NG
version: ng-1
fixed:
  days:
    - {name: New Year's Day, month: 1, day: 1}
    - {name: Workers' Day, month: 5, day: 1}
    - {name: Independence Day, month: 10, day: 1}
    - {name: Christmas Day, month: 12, day: 25}
  source: Federal Ministry of Interior public holidays. https://interior.gov.ng
bank_codes:
  deposit_money_bank:
    - {first: 1, last: 999, nuban_prefix: "", nuban_digits: 3, nip_prefix: "000", nip_digits: 3}
    - {first: 1000, last: 89999, nuban_prefix: "", nuban_digits: 6, nip_prefix: "", nip_digits: 6}
  microfinance_bank:
    - {first: 1, last: 999, nuban_prefix: "5", nuban_digits: 4, nip_prefix: "090", nip_digits: 3}
    - {first: 1000, last: 9999, nuban_prefix: "5", nuban_digits: 4, nip_prefix: "09", nip_digits: 4}
  source: "CBN Revised Standards on NUBAN (2020): deposit money banks have 3-digit codes, other financial institutions 5-digit codes that NUBAN prefixes with 9. https://www.cbn.gov.ng/Out/2020/PSMD/REVISED%20STANDARDS%20ON%20NIGERIA%20UNIFORM%20BANK%20ACCOUNT%20NUMBER%20(NUBAN)%20FOR%20BANKS%20AND%20OTHER%20FINANCIAL%20INSTITUTIONS%20.pdf . NIP code shapes (000xxx for deposit money banks, 090xxx for microfinance banks) follow public bank code lists; NIBSS publishes no official list. Second tiers are Beerus placeholders for when the real-format codes run out."
fees:
  nip:
    - from: 2020-01-01
      bands:
        - {up_to_minor: 500000, fee_minor: 1000}
        - {up_to_minor: 5000000, fee_minor: 2500}
        - {fee_minor: 5000}
      source: CBN Guide to Charges by Banks, Other Financial and Non-Financial Institutions, effective 1 January 2020, which sets N10 below N5,000, N25 from N5,000 to N50,000 and N50 above N50,000. The bands were confirmed from press reports of the guide, not from the scanned CBN PDF.
  stamp_duty:
    - from: 2020-01-01
      threshold_minor: 0
      amount_minor: 0
      source: Beerus placeholder. Stamp duty on electronic transfers is modelled as starting on 2026-01-01, with the earlier levy carried by emtl.
    - from: 2026-01-01
      threshold_minor: 1000000
      amount_minor: 5000
      source: Nigeria Tax Act 2025 replaces the electronic money transfer levy with a N50 stamp duty on transfers of N10,000 and above, charged to the sender from 1 January 2026. https://techeconomy.ng/stamp-duty-replaces-emtl-sender-to-bear-50-charge-on-bank-transfers
  emtl:
    - from: 2020-01-01
      threshold_minor: 1000000
      amount_minor: 5000
      source: Electronic money transfer levy of N50 on transfers of N10,000 and above, under the Finance Act 2020 and CBN circulars. The amount and threshold were not re-confirmed against the Act text. https://techeconomy.ng/stamp-duty-replaces-emtl-sender-to-bear-50-charge-on-bank-transfers
    - from: 2026-01-01
      threshold_minor: 0
      amount_minor: 0
      source: The Nigeria Tax Act 2025 replaces the levy with stamp duty from 1 January 2026. https://techeconomy.ng/stamp-duty-replaces-emtl-sender-to-bear-50-charge-on-bank-transfers
  vat_rate_basis_points:
    value: 750
    source: Finance Act 2019 sets VAT at 7.5 percent. No page was opened to confirm it.
  sms_alert_fee_minor:
    value: 400
    source: CBN guide to charges allows banks to charge not more than N4 per SMS alert on request. The cap is quoted in https://nairametrics.com/breakdown-of-new-cbn-guide-to-charges-by-banks/ which covers the 2017 guide. The 2020 text was not read.
  sms_monthly_cap_minor:
    value: 50000
    source: Beerus placeholder. The CBN guide gives no monthly cap on SMS alert charges that we could confirm.
  maintenance_per_mille:
    value: 1
    source: CBN guide to charges caps the account maintenance fee at N1 per mille of customer-induced debit turnover. The cap is quoted in https://nairametrics.com/breakdown-of-new-cbn-guide-to-charges-by-banks/ which covers the 2017 guide. The 2020 text was not read.
phone:
  calling_code: "234"
  trunk_prefix: "0"
  source: "Nigeria's numbering plan filed with the ITU by the NCC, 2023: country code 234, national prefix 0. https://www.itu.int/dms_pub/itu-t/oth/02/02/T020200009C0002PDFE.pdf"
deposit_insurance:
  limits_minor: {deposit_money_bank: 500000000, microfinance_bank: 200000000}
  bank_types: {commercial: deposit_money_bank, digital: deposit_money_bank, microfinance: microfinance_bank}
  placeholder: Beerus maps the digital bank type to the deposit money bank limit. Many real digital banks hold microfinance licences, so this mapping is a placeholder until bank type means licence category.
  source: The NDIC raised maximum cover to 5,000,000 naira for deposit money banks and 2,000,000 naira for microfinance banks on 24-25 April 2024. https://guardian.ng/business-services/ndic-raises-maximum-bank-deposit-insurance-coverage-to-n5m/
